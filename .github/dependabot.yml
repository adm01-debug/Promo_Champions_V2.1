version: 2
updates:
  # NPM dependencies — grupos evitam PRs individuais por pacote Radix/React/etc.
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 10
    assignees:
      - "adm01-debug"
    labels:
      - "dependencies"
      - "automated"
    commit-message:
      prefix: "chore"
      include: "scope"
    groups:
      radix-ui:
        patterns:
          - "@radix-ui/*"
      react-core:
        patterns:
          - "react"
          - "react-dom"
          - "react-router*"
          - "@types/react*"
      testing:
        patterns:
          - "vitest*"
          - "@vitest/*"
          - "@testing-library/*"
          - "playwright*"
          - "@playwright/*"
      build-tools:
        patterns:
          - "vite*"
          - "@vitejs/*"
          - "esbuild*"
          - "rollup*"
          - "typescript*"

  # GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    assignees:
      - "adm01-debug"
    labels:
      - "ci"
      - "dependencies"
    groups:
      actions-core:
        patterns:
          - "actions/*"
      actions-runtime:
        patterns:
          - "denoland/*"
          - "astral-sh/*"
          - "supabase/*"
