name: Edge Functions Input Validation Lint

on:
  push:
    branches: [main]
    paths:
      - 'supabase/functions/**'
      - 'scripts/lint-input-validation.ts'
      - 'scripts/input-validation-lint-allowlist.txt'
      - '.github/workflows/edge-functions-input-validation.yml'
      - 'deno.lock'
      - 'deno.json'
      - 'package.json'
  pull_request:
    branches: [main]
    paths:
      - 'supabase/functions/**'
      - 'scripts/lint-input-validation.ts'
      - 'scripts/input-validation-lint-allowlist.txt'
      - '.github/workflows/edge-functions-input-validation.yml'
      - 'deno.lock'
      - 'deno.json'
      - 'package.json'

permissions:
  contents: read

concurrency:
  group: input-validation-lint-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    name: Bloqueia edge function que grava sem validar payload
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Deno
        uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2
        with:
          deno-version: v2.9.x

      - name: Lockfile drift check
        run: |
          deno install --frozen=false
          if ! git diff --exit-code deno.lock; then
            echo "::error::deno.lock desatualizado — rode 'deno install --frozen=false' localmente e commite o lockfile"
            exit 1
          fi

      - name: Lint — block DB writes without input validation
        run: deno run --frozen --allow-read scripts/lint-input-validation.ts
