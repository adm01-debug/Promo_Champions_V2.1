name: Quote-to-Sale Guard Rails

on:
  pull_request:
    paths:
      - 'src/hooks/useQuotes.ts'
      - 'src/hooks/quoteErrorMessages.ts'
      - 'src/pages/*Quote*'
      - 'src/components/quotes/**'
      - 'tests/e2e/quote-to-sale-*'
      # Sem sufixo: o glob acima não cobre quote-to-sale.spec.ts.
      - 'tests/e2e/quote-to-sale.spec.ts'
      - 'tests/e2e/helpers/quote-to-sale-*'
      - 'scripts/verify-quote-to-sale-invariants.ts'
      # Mudanças na config da suíte ou no próprio workflow também devem
      # rodar os guard rails que eles controlam.
      - 'playwright.config.ts'
      - '.github/workflows/quote-to-sale-e2e.yml'
      - 'supabase/migrations/**convert**'
      - 'supabase/migrations/**quote**'
      - 'supabase/functions/**'
      - 'supabase/tests/quote-to-sale-stress.sql'
  workflow_dispatch:

permissions:
  contents: read
  actions: write

# Grupo único repo-wide: a suíte e os invariantes batem na MESMA base de
# produção — duas PRs em paralelo fariam o invariants de uma flagar sales
# mid-flight da outra. Sem cancel-in-progress: cancelar uma suíte no meio
# deixaria dados de teste órfãos.
concurrency:
  group: quote-to-sale
  cancel-in-progress: false

jobs:
  unit-tests:
    name: Unit — parseConvertQuoteError
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      HUSKY: 0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: package-lock.json
      - name: Install
        run: npm ci
      - name: Vitest — quote-error-messages
        run: npx vitest run src/test/quote-error-messages.test.ts src/test/quote-conversion-errors.test.ts

  invariants:
    name: Production Invariants
    runs-on: ubuntu-latest
    timeout-minutes: 8
    # Roda DEPOIS da suíte E2E: o check bate em produção e sales mid-flight
    # de specs em execução apareceriam como órfãs falsas.
    needs: [unit-tests, e2e-quote-to-sale]
    # Somente PRs internas — evita expor credenciais em fork PRs.
    # always() garante execução mesmo se a suíte E2E falhar.
    if: always() && (github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && github.actor != 'dependabot[bot]' && github.event.pull_request.head.repo.full_name == github.repository))
    environment: pr-preview
    env:
      HUSKY: 0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: package-lock.json
      - name: Install
        run: npm ci
      - name: Run invariants script
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
          E2E_TEST_EMAIL: ${{ secrets.E2E_TEST_EMAIL }}
          E2E_TEST_PASSWORD: ${{ secrets.E2E_TEST_PASSWORD }}
        run: |
          n=0
          [ -n "$VITE_SUPABASE_URL" ] && n=$((n+1))
          [ -n "$VITE_SUPABASE_PUBLISHABLE_KEY" ] && n=$((n+1))
          [ -n "$E2E_TEST_EMAIL" ] && n=$((n+1))
          [ -n "$E2E_TEST_PASSWORD" ] && n=$((n+1))
          if [ "$n" -eq 0 ]; then
            echo "::warning::Invariantes SKIPPED — nenhum secret de integração configurado"
            exit 0
          elif [ "$n" -lt 4 ]; then
            echo "::error::Configuração parcial ($n/4). Secrets necessários: VITE_SUPABASE_URL, VITE_SUPABASE_PUBLISHABLE_KEY, E2E_TEST_EMAIL, E2E_TEST_PASSWORD"
            exit 1
          fi
          npx tsx scripts/verify-quote-to-sale-invariants.ts

  e2e-quote-to-sale:
    name: E2E — Quote-to-Sale Suite
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: unit-tests
    # Somente PRs internas (não forks, não Dependabot) — guard que faltava.
    if: github.event_name == 'pull_request' && github.actor != 'dependabot[bot]' && github.event.pull_request.head.repo.full_name == github.repository || github.event_name == 'workflow_dispatch'
    environment: pr-preview
    env:
      HUSKY: 0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: package-lock.json
      - name: Install
        run: npm ci
      - name: Validar configuração E2E
        id: skip
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
          E2E_TEST_EMAIL: ${{ secrets.E2E_TEST_EMAIL }}
          E2E_TEST_PASSWORD: ${{ secrets.E2E_TEST_PASSWORD }}
        run: |
          n=0
          [ -n "$VITE_SUPABASE_URL" ] && n=$((n+1))
          [ -n "$VITE_SUPABASE_PUBLISHABLE_KEY" ] && n=$((n+1))
          [ -n "$E2E_TEST_EMAIL" ] && n=$((n+1))
          [ -n "$E2E_TEST_PASSWORD" ] && n=$((n+1))
          if [ "$n" -eq 0 ]; then
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "::warning::E2E SKIPPED — nenhum secret de integração configurado"
          elif [ "$n" -lt 4 ]; then
            echo "::error::Configuração parcial ($n/4). Secrets necessários: VITE_SUPABASE_URL, VITE_SUPABASE_PUBLISHABLE_KEY, E2E_TEST_EMAIL, E2E_TEST_PASSWORD"
            exit 1
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi
      # Mesmo contrato do pr-checks.yml: secrets presentes porém inválidos
      # falham o job (antes viravam skip verde); falha transitória de rede
      # (exit 3) segue skip legítimo com warning.
      - name: Verificar validade das credenciais Supabase
        id: precheck
        if: steps.skip.outputs.run == 'true'
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
          E2E_TEST_EMAIL: ${{ secrets.E2E_TEST_EMAIL }}
          E2E_TEST_PASSWORD: ${{ secrets.E2E_TEST_PASSWORD }}
        run: |
          set +e
          node scripts/e2e-precheck.mjs
          CODE=$?
          set -e
          if [ "$CODE" -eq 0 ]; then
            echo "valid=true" >> "$GITHUB_OUTPUT"
          elif [ "$CODE" -eq 3 ]; then
            echo "valid=skip" >> "$GITHUB_OUTPUT"
          else
            echo "::error::Credenciais E2E configuradas, mas inválidas. Corrija ou remova a configuração parcial; não é seguro aprovar o gate sem executar os cenários."
            exit 1
          fi
      - name: Install Playwright
        if: steps.skip.outputs.run == 'true' && steps.precheck.outputs.valid == 'true'
        run: npx playwright install --with-deps chromium
      - name: Playwright — quote-to-sale specs
        if: steps.skip.outputs.run == 'true' && steps.precheck.outputs.valid == 'true'
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
          # global-setup exige o project ref para persistir a sessão. O precheck
          # o deriva da URL verificada (<ref>.supabase.co); o secret vira só
          # fallback para hosts fora de *.supabase.co.
          VITE_SUPABASE_PROJECT_ID: ${{ steps.precheck.outputs.project_ref || secrets.VITE_SUPABASE_PROJECT_ID }}
          E2E_TEST_EMAIL: ${{ secrets.E2E_TEST_EMAIL }}
          E2E_TEST_PASSWORD: ${{ secrets.E2E_TEST_PASSWORD }}
        # Seleção por projeto (testMatch /quote-to-sale.*\.spec\.ts/) — o glob
        # anterior 'quote-to-sale-*.spec.ts' deixava fora 'quote-to-sale.spec.ts'
        # (sem sufixo), que hoje só rodava por acidente no job genérico de E2E.
        run: npx playwright test --project=quote-to-sale --workers=1
      - name: Upload report
        if: always() && steps.skip.outputs.run == 'true' && steps.precheck.outputs.valid == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: playwright-quote-to-sale-report
          path: playwright-report/
          retention-days: 14
