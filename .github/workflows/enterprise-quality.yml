name: Enterprise Quality Assurance

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  quality-gate:
    runs-on: ubuntu-latest
    env:
      HUSKY: 0
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci
        
      - name: Code Quality (Lint)
        run: npm run lint
        
      - name: Integrity Check (Typecheck)
        run: npm run typecheck
        
      - name: Unit & Integration Tests
        run: npm run test
        
      - name: Coverage Check
        run: |
          npm run test:coverage
          # Block if coverage is below 80% (example gate)
          # Note: this requires vitest coverage to be configured with thresholds
          
      - name: Build Verification
        run: npm run build
        
      - name: Security Audit
        run: npm audit --production --audit-level=high

  e2e-simulation:
    needs: quality-gate
    runs-on: ubuntu-latest
    env:
      HUSKY: 0
    steps:
      - uses: actions/checkout@v7
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: 'npm'
      - name: Install Dependencies
        run: npm ci
      # tests/e2e/ contains Playwright specs — must use Playwright, NOT vitest.
      # Running `vitest run tests/e2e` collected 0 tests and exited 0 (false green).
      - name: Install Playwright Browsers
        run: npx playwright install --with-deps chromium
      - name: Run E2E Journeys
        run: npm run test:e2e
      - name: Upload Playwright Report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report-enterprise
          path: playwright-report/
          retention-days: 14
