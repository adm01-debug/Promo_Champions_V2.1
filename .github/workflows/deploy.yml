name: Deploy Pipeline

# Pipeline de deploy com approval (environment 'production').
#
# Disparo:
#   - workflow_dispatch: deploy manual da ref escolhida (default: main)
#   - push de tag 'v*' (criada pelo release-please ou manualmente)
#
# O job `deploy` roda no environment 'production': enquanto o ambiente tiver
# "Required reviewers" configurado em Settings → Environments, todo deploy
# fica pendente até um aprovador humano liberar (approval gate real do GitHub).
#
# O que este pipeline FAZ de fato (sem secrets):
#   1. Revalida o que vai para produção: typecheck, lint, testes, build.
#   2. Revalida as edge functions (deno check em todas, mesmo gate do CI).
#   3. Roda o gate de higiene de migrations (scripts/check-migrations.mjs).
#   4. Publica um resumo com os passos de deploy e links dos dashboards.
#
# O que este pipeline NÃO FAZ sem secrets/configuração (documentado abaixo):
#   - Deploy das edge functions: exige SUPABASE_ACCESS_TOKEN
#     (`supabase functions deploy --project-ref usyxfpqlsspldubptrdl`).
#   - Aplicação de migrations pendentes: exige SUPABASE_ACCESS_TOKEN +
#     SUPABASE_DB_PASSWORD (`supabase db push --linked`).
#   - Deploy do frontend: feito pela Lovable Cloud (build+publish a partir
#     da branch main), não existe CLI — o step `deploy` só valida e documenta.
#
# Dashboards:
#   Lovable:  https://lovable.dev (projeto Promo Champions)
#   Supabase: https://supabase.com/dashboard/project/usyxfpqlsspldubptrdl

on:
  workflow_dispatch:
    inputs:
      ref:
        description: 'Ref a deployar (branch, tag ou SHA)'
        required: false
        default: 'main'
  push:
    tags:
      - 'v*'

permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  validate:
    name: Validate Release Candidate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      HUSKY: 0
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.inputs.ref || github.sha }}

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: TypeScript check
        run: npm run typecheck

      - name: ESLint
        run: npm run lint

      - name: Unit tests
        run: npm run test:coverage

      - name: Build (validação — artefato de produção é buildado pela Lovable)
        env:
          VITE_SUPABASE_URL: https://placeholder.supabase.co
          VITE_SUPABASE_PUBLISHABLE_KEY: placeholder-anon-key
        run: npm run build

      - name: Setup Deno
        uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2
        with:
          deno-version: v2.9.x

      - name: Edge functions bundle check
        run: |
          deno run --allow-read --allow-run --allow-env --allow-net \
            scripts/bundle-edge-functions.ts

      - name: Migrations hygiene gate (check-migrations)
        run: |
          if [ -f scripts/check-migrations.mjs ]; then
            node scripts/check-migrations.mjs
          else
            echo "::warning::scripts/check-migrations.mjs ainda não existe na main (chega via PR de higiene de migrations) — gate pulado neste deploy."
          fi

  deploy:
    name: Deploy → production
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: validate
    environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.inputs.ref || github.sha }}

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@45a513f8c64c0bc8e0e3dfe572b5c95be85f6359 # v3
        with:
          version: latest

      - name: Deploy das edge functions (requer SUPABASE_ACCESS_TOKEN)
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::warning::SUPABASE_ACCESS_TOKEN não configurado — deploy das edge functions fica para execução manual:"
            echo "  supabase functions deploy --project-ref usyxfpqlsspldubptrdl"
            exit 0
          fi
          supabase functions deploy --project-ref usyxfpqlsspldubptrdl

      - name: Aplicar migrations pendentes (requer secrets Supabase)
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ] || [ -z "$SUPABASE_DB_PASSWORD" ]; then
            echo "::warning::Secrets Supabase ausentes — migrations ficam para execução manual:"
            echo "  supabase link --project-ref usyxfpqlsspldubptrdl && supabase db push --linked"
            exit 0
          fi
          supabase link --project-ref usyxfpqlsspldubptrdl
          supabase db push --linked

      - name: Deploy do frontend (Lovable Cloud)
        run: |
          # O frontend é publicado pela integração Lovable ↔ GitHub (sync da
          # branch main) ou manualmente no dashboard. Não há CLI público.
          echo "Frontend deploy: https://lovable.dev (projeto Promo Champions)"
          echo "Se a tag foi criada a partir de main, o sync automático já cobre."
          echo "Caso contrário, publicar manualmente no dashboard da Lovable."

      - name: Post-deploy health check (edge function 'health')
        run: |
          URL="https://usyxfpqlsspldubptrdl.supabase.co/functions/v1/health"
          CODE=$(curl -sS -o /tmp/health.json -w '%{http_code}' --max-time 20 "$URL" || true)
          cat /tmp/health.json 2>/dev/null || true
          if [ "$CODE" = "200" ]; then
            echo "Health check OK ($CODE)"
          else
            echo "::warning::Health check retornou HTTP $CODE — se a function 'health' ainda não foi deployada, isso é esperado."
          fi

      - name: Resumo do deploy
        run: |
          {
            echo "## Deploy — Promo Champions V2.1"
            echo ""
            echo "- Ref: \`${{ github.event.inputs.ref || github.sha }}\`"
            echo "- Aprovado no environment: production"
            echo ""
            echo "### Passos manuais pendentes (sem secrets no Actions)"
            echo "1. Frontend: publicar/verificar no dashboard Lovable"
            echo "2. Functions: \`supabase functions deploy --project-ref usyxfpqlsspldubptrdl\`"
            echo "3. Migrations: \`supabase db push --linked\`"
            echo ""
            echo "### Links"
            echo "- Supabase: https://supabase.com/dashboard/project/usyxfpqlsspldubptrdl"
            echo "- Lovable: https://lovable.dev"
          } >> "$GITHUB_STEP_SUMMARY"
