name: Deploy Pipeline

# Pipeline de deploy com approval (environment 'production').
#
# Disparo:
#   - workflow_dispatch: deploy manual da ref escolhida (default: main)
#   - push de tag 'v*' (criada pelo release-please ou manualmente)
#
# O job `deploy` roda no environment 'production': enquanto o ambiente tiver
# "Required reviewers" configurado em Settings → Environments, todo deploy
# fica pendente até um aprovador humano liberar (approval gate real do GitHub).
#
# O que este pipeline FAZ de fato (sem secrets):
#   1. Revalida o que vai para produção: typecheck, lint, testes, build.
#   2. Revalida as edge functions (deno check em todas, mesmo gate do CI).
#   3. Roda o gate de higiene de migrations (scripts/check-migrations.mjs).
#   4. Publica um resumo com os passos de deploy e links dos dashboards.
#
# O que este pipeline NÃO FAZ sem secrets/configuração (documentado abaixo):
#   - Deploy das edge functions: exige SUPABASE_ACCESS_TOKEN
#     (`supabase functions deploy --project-ref usyxfpqlsspldubptrdl`).
#   - Aplicação de migrations pendentes: exige SUPABASE_ACCESS_TOKEN +
#     SUPABASE_DB_PASSWORD (`supabase db push --linked`).
#   - Deploy do frontend: feito pela integração Vercel↔GitHub (build+publish a partir
#     da branch main), não existe CLI — o step `deploy` só valida e documenta.
#
# Dashboards:
#   Vercel:   https://vercel.com/juca1/promo-champions-v2-1
#   Supabase: https://supabase.com/dashboard/project/usyxfpqlsspldubptrdl

on:
  workflow_dispatch:
    inputs:
      ref:
        description: 'Ref a deployar (branch, tag ou SHA)'
        required: false
        default: 'main'
  push:
    tags:
      - 'v*'
      - 'promo-champions-v2-v*'

permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

# `version: latest` fazia o deploy das edge functions e o `db push` rodarem com um CLI
# que muda sozinho: uma release do Supabase podia quebrar o deploy em produção sem
# nenhum commit neste repo. 3.0.0 é o que o dist-tag `latest` do npm resolve hoje
# (`latest=3.0.0`, `v2.stable=2.122.1`), então travar aqui não muda nada do que já roda.
# O types-sync.yml usa 2.116.0; as duas geram o mesmo types.ts hoje. Ver nota nos outros.
env:
  SUPABASE_CLI_VERSION: '3.0.0'

jobs:
  validate:
    name: Validate Release Candidate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      HUSKY: 0
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.inputs.ref || github.sha }}

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: TypeScript check
        run: npm run typecheck

      - name: ESLint
        run: npm run lint

      - name: Unit tests
        run: npm run test:coverage

      - name: Build (validação — artefato de produção é buildado pela Vercel)
        env:
          VITE_SUPABASE_URL: https://placeholder.supabase.co
          VITE_SUPABASE_PUBLISHABLE_KEY: placeholder-anon-key
        run: npm run build

      - name: Setup Deno
        uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: v2.9.x

      - name: Edge functions bundle check
        run: |
          deno run --allow-read --allow-run --allow-env --allow-net \
            scripts/bundle-edge-functions.ts

      - name: Migrations hygiene gate (check-migrations)
        run: |
          if [ -f scripts/check-migrations.mjs ]; then
            node scripts/check-migrations.mjs
          else
            echo "::warning::scripts/check-migrations.mjs ainda não existe na main (chega via PR de higiene de migrations) — gate pulado neste deploy."
          fi

  deploy:
    name: Deploy → production
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: validate
    environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.inputs.ref || github.sha }}

      - name: Setup Supabase CLI ${{ env.SUPABASE_CLI_VERSION }}
        uses: supabase/setup-cli@689adcfb80d947100a1eab127289b97d1fb07b13 # v3.2.0
        with:
          version: ${{ env.SUPABASE_CLI_VERSION }}

      - name: Deploy das edge functions (requer SUPABASE_ACCESS_TOKEN)
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::warning::SUPABASE_ACCESS_TOKEN não configurado — deploy das edge functions fica para execução manual:"
            echo "  supabase functions deploy --project-ref usyxfpqlsspldubptrdl"
            exit 0
          fi
          # O plano Supabase limita a 100 functions deployadas (docs/DEPLOYMENT.md §4).
          # Deployar todas (171) com `--yes` estoura 402 (function.max_count) na 101ª.
          # Aqui deployamos por allowlist das 100 ativas: sem regressão nas vivas,
          # adição manual de novas funciona, e o limite nunca trava um redeploy.
          ACTIVE=$'access-denied-alerts\naccount-engagement-aggregator\nactivity-goal-alerts\naggregate-coaching-scorecard\nai-email-composer\nanalyze-call\nanalyze-conversation-metrics\nanalyze-conversation\nanalyze-objection-handling\nanalyze-question-quality\nanalyze-sentiment-timeline\nanalyze-skill-gaps\nanalyze-stage-conversion\nanalyze-win-loss\nauto-enroll-cadence\nauto-reassign-inactive\nautomation-suggestions\nbehavioral-analysis\nbitrix24-oauth\nbitrix24-sync\nbroadcast-sale-notification\ncalculate-deal-health\ncampaign-health-alert\ncoaching-intelligence\ncoaching-session-prep\ncollect-race-powerup\nconversational-intelligence\ncreate-stagnant-tasks\ncron-failure-alerter\ncsat-ces-trigger\ncustomer-success-360\ncustomer-success-hub\ndeal-probability\ndeal-risk-digest\ndemand-forecast\ndetect-at-risk-deals\ndetect-client-churn-alerts\ndetect-coaching-opportunities\ndetect-competitor-mentions\ndetect-critical-moments\ndetect-stuck-deals\ndetect-winloss-at-risk\ndialer-queue-builder\ndiarize-call-recording\ndispatch-webhook\nedge-retry-threshold-alert\nelevenlabs-tts\nelevenlabs-voice\nemail-bulk-retry\nemail-bulk-send\nemail-composer-bulk\nemail-engagement-scorer\nemail-unsubscribe\nengagement-score-recompute\nenrich-lead\nexecute-workflow\nexpansion-detector\nexport-winloss-pdf\nexternal-db-bridge\nextract-coaching-actions\nextract-committee-from-call\nforecast-narrative\ngenerate-coaching-actions\ngenerate-executive-briefing\ngenerate-urgent-client-tasks\nhelpdesk-sync\ninbound-email-webhook\nlog-web-vitals\nmine-win-loss-patterns\nmultichannel-status-webhook\nnext-best-action\nnotify-quote-conversion\nnotify-ranking-position\nnotify-v4-quote-status\nonboarding-launcher\npersonal-assistant-stream\npipeline-pulse-aggregator\npredict-deal-velocity\npredictive-intelligence\npredictive-scoring-explain\npricing-intelligence\nprocess-cadence-tasks\nprocess-race-event\nrace-commentary\nreceive-quote-sync\nreport-embed-public\nrevenue-forecast-ai\nrevenue-intelligence\nrevops-hub\nsales-assistant-chat\nsemantic-search\nsend-churn-alert-email\nsend-multichannel-message\nsend-transactional-email\nsequence-runner\nstart-race-season\nterritory-optimization\nvisual-search\nwal-health-alert\nwebauthn'
          for FN in $ACTIVE; do
            if [ -d "supabase/functions/$FN" ]; then
              echo "Deploying: $FN"
              supabase functions deploy "$FN" --yes --project-ref usyxfpqlsspldubptrdl
            else
              echo "::warning::function '$FN' não existe no repo — remova da allowlist ou ajuste o nome."
            fi
          done
          # Novas functions exigem vagas livres (limite 100). Documenta o processo no summary.
          echo "::notice::Novas edge functions exigem vaga: remova uma obsoleta de produção (Dashboard) ou suba o plano antes de adicionar à allowlist."

      - name: Aplicar migrations pendentes (requer secrets Supabase)
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ] || [ -z "$SUPABASE_DB_PASSWORD" ]; then
            echo "::warning::Secrets Supabase ausentes — migrations ficam para execução manual:"
            echo "  supabase link --project-ref usyxfpqlsspldubptrdl && supabase db push --linked"
            exit 0
          fi
          supabase link --project-ref usyxfpqlsspldubptrdl
          supabase db push --linked

      - name: Deploy do frontend (Vercel)
        run: |
          # O frontend é publicado pela integração Vercel ↔ GitHub (build+publish
          # branch main) ou manualmente no dashboard. Não há CLI público.
          echo "Frontend deploy: https://vercel.com/juca1/promo-champions-v2-1"
          echo "Se a tag foi criada a partir de main, o sync automático já cobre."
          echo "Caso contrário, confirme o deploy no painel da Vercel."

      - name: Post-deploy health check (edge function 'health')
        run: |
          URL="https://usyxfpqlsspldubptrdl.supabase.co/functions/v1/health"
          CODE=$(curl -sS -o /tmp/health.json -w '%{http_code}' --max-time 20 "$URL" || true)
          cat /tmp/health.json 2>/dev/null || true
          if [ "$CODE" = "200" ]; then
            echo "Health check OK ($CODE)"
          else
            echo "::warning::Health check retornou HTTP $CODE — se a function 'health' ainda não foi deployada, isso é esperado."
          fi

      - name: Resumo do deploy
        run: |
          {
            echo "## Deploy — Promo Champions V2.1"
            echo ""
            echo "- Ref: \`${{ github.event.inputs.ref || github.sha }}\`"
            echo "- Aprovado no environment: production"
            echo ""
            echo "### Passos manuais pendentes (sem secrets no Actions)"
            echo "1. Frontend: confirmar o deploy no painel da Vercel"
            echo "2. Functions novas: adicionar à allowlist do step de deploy (\`supabase functions deploy <nome> --yes --project-ref usyxfpqlsspldubptrdl\`) após liberar vaga (limite 100)"
            echo "3. Migrations: \`supabase db push --linked\`"
            echo ""
            echo "### Links"
            echo "- Supabase: https://supabase.com/dashboard/project/usyxfpqlsspldubptrdl"
            echo "- Vercel: https://vercel.com/juca1/promo-champions-v2-1"
          } >> "$GITHUB_STEP_SUMMARY"
