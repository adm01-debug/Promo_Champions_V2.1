name: Edge Functions Bundle Check

on:
  push:
    branches: [main]
    paths:
      - 'supabase/functions/**'
      - 'scripts/bundle-edge-functions.ts'
      - '.github/workflows/edge-functions-bundle.yml'
      - 'deno.lock'
      - 'deno.json'
      - 'package.json'
  pull_request:
    branches: [main]
    paths:
      - 'supabase/functions/**'
      - 'scripts/bundle-edge-functions.ts'
      - '.github/workflows/edge-functions-bundle.yml'
      - 'deno.lock'
      - 'deno.json'
      - 'package.json'

permissions:
  contents: read
  actions: write

# Cancel in-flight runs when a new commit is pushed to the same branch/PR.
concurrency:
  group: edge-bundle-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  bundle:
    name: Bundle every edge function & report failing imports
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Deno
        uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2
        with:
          deno-version: v2.9.x

      # Cache the Deno module download directory so repeat runs are fast and
      # network blips don't masquerade as bundle failures.
      - name: Cache Deno dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.cache/deno
          key: deno-${{ runner.os }}-${{ hashFiles('deno.lock') }}
          restore-keys: |
            deno-${{ runner.os }}-

      - name: Lockfile drift check
        run: |
          deno install --frozen=false
          if ! git diff --exit-code deno.lock; then
            echo "::error::deno.lock desatualizado — rode 'deno install --frozen=false' localmente e commite o lockfile"
            exit 1
          fi

      - name: Bundle every edge function
        id: bundle
        run: |
          set -o pipefail
          deno run --frozen --allow-read --allow-run --allow-env --allow-net \
            scripts/bundle-edge-functions.ts | tee bundle-report.txt
        # The script exits 1 when any function fails to bundle; let the step
        # propagate that exit code so the job (and PR check) goes red.

      - name: Upload bundle report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: edge-functions-bundle-report
          path: bundle-report.txt
          retention-days: 14

      - name: Append summary to job
        if: always()
        run: |
          {
            echo "## Edge Functions Bundle Check"
            echo ""
            echo '```'
            tail -n 80 bundle-report.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
