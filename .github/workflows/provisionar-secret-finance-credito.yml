# docs:
#   gatilho: dispatch manual com confirmacao APLICAR; roda so quando o dono decidir publicar os segredos
#   prova: a Management API responde 200/201 nos dois POSTs e o GET seguinte lista os nomes nos dois projetos
#   falha: GET de pre-checagem != 200 em qualquer projeto aborta ANTES de gravar; POST != 200/201 deixa o job vermelho
#   avisa: o resumo do run lista apenas NOMES de secrets, nunca valores
# nao-e-bug:
#   - sem-eco-de-valor: os valores nascem no runner (openssl rand), sao mascarados e nunca aparecem no log
#   - gerado-aqui: diferente do supply-webhook, nenhum dos dois lados ja tinha segredo — gerar e publicar
#     nos DOIS projetos no mesmo run e' o que garante que o HMAC fecha dos dois lados
# ==================================================================
# PROMO CHAMPIONS - Provisionar os segredos da analise de credito (Finance)
# ==================================================================
# Por que existe: a edge credit-dispatch falha fechada com 503 enquanto
# PROMO_FINANCE_CREDITO_WEBHOOK_SECRET nao existir, e receive-credit-decision
# rejeita tudo sem FINANCE_CREDITO_WEBHOOK_SECRET. Do lado do Finance,
# credito-solicitacao e credito-analise precisam dos mesmos valores com os
# nomes CHAMPIONS_CREDITO_*. Um unico run publica os dois lados:
#
#   Champions (usyxfpqlsspldubptrdl)        Finance (bwwbeyolnnzppeuhgkcd)
#   PROMO_FINANCE_CREDITO_WEBHOOK_SECRET  = CHAMPIONS_CREDITO_WEBHOOK_SECRET
#   FINANCE_CREDITO_WEBHOOK_SECRET        = CHAMPIONS_CREDITO_CALLBACK_SECRET
#   PROMO_FINANCE_CREDITO_WEBHOOK_URL       CHAMPIONS_CREDITO_CALLBACK_URL

name: Provisionar secrets da integracao de credito (Finance)

on:
  workflow_dispatch:
    inputs:
      confirmacao:
        description: 'Digite APLICAR para publicar os secrets de credito nos projetos Champions e Finance'
        required: true
      sobrescrever:
        description: 'Regerar os valores mesmo que algum secret ja exista (os dois lados sao reescritos juntos)'
        type: boolean
        default: false

defaults:
  run:
    shell: bash --noprofile --norc -euo pipefail {0}

permissions:
  contents: read

concurrency:
  group: provisionar-secret-finance-credito
  cancel-in-progress: false

jobs:
  provisionar:
    name: Publicar secrets de credito nos dois projetos
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CHAMPIONS_REF: usyxfpqlsspldubptrdl
      FINANCE_REF: bwwbeyolnnzppeuhgkcd
      FINANCE_URL: https://bwwbeyolnnzppeuhgkcd.supabase.co/functions/v1/credito-solicitacao
      CHAMPIONS_URL: https://usyxfpqlsspldubptrdl.supabase.co/functions/v1/receive-credit-decision
      NOMES_CHAMPIONS: PROMO_FINANCE_CREDITO_WEBHOOK_SECRET FINANCE_CREDITO_WEBHOOK_SECRET PROMO_FINANCE_CREDITO_WEBHOOK_URL
      NOMES_FINANCE: CHAMPIONS_CREDITO_WEBHOOK_SECRET CHAMPIONS_CREDITO_CALLBACK_SECRET CHAMPIONS_CREDITO_CALLBACK_URL
    steps:
      - name: Validar a entrada e as credenciais
        env:
          CONFIRMACAO: ${{ inputs.confirmacao }}
          ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          if [[ "${CONFIRMACAO}" != "APLICAR" ]]; then
            echo "::error::confirmacao diferente de APLICAR. Nada foi publicado."
            exit 1
          fi
          if [[ -z "${ACCESS_TOKEN}" ]]; then
            echo "::error::faltando: SUPABASE_ACCESS_TOKEN"
            exit 1
          fi
          echo "credenciais presentes; nada sera ecoado."

      - name: Pre-checagem — o token enxerga os dois projetos
        env:
          ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SOBRESCREVER: ${{ inputs.sobrescrever }}
        run: |
          conflito=0
          for par in "${CHAMPIONS_REF}:${NOMES_CHAMPIONS}" "${FINANCE_REF}:${NOMES_FINANCE}"; do
            ref="${par%%:*}"; nomes="${par#*:}"
            codigo="$(curl -sS -o nomes.json -w '%{http_code}' \
              "https://api.supabase.com/v1/projects/${ref}/secrets" \
              -H "Authorization: Bearer ${ACCESS_TOKEN}")"
            if [[ "${codigo}" != "200" ]]; then
              echo "::error::GET secrets de ${ref} respondeu ${codigo}; nada foi gravado em lugar nenhum."
              rm -f nomes.json
              exit 1
            fi
            read -r -a lista <<< "${nomes}"
            for nome in "${lista[@]}"; do
              if jq -e --arg n "${nome}" 'map(.name) | index($n) != null' nomes.json >/dev/null; then
                echo "::warning::${nome} ja existe em ${ref}"
                conflito=1
              fi
            done
            rm -f nomes.json
          done
          if [[ "${conflito}" == "1" && "${SOBRESCREVER}" != "true" ]]; then
            echo "::error::secret ja existente; re-dispare com sobrescrever=true para regerar os dois lados."
            exit 1
          fi
          echo "token valido nos dois projetos."

      - name: Gerar e publicar os valores nos dois projetos
        env:
          ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          segredo_webhook="$(openssl rand -hex 32)"
          segredo_callback="$(openssl rand -hex 32)"
          echo "::add-mask::${segredo_webhook}"
          echo "::add-mask::${segredo_callback}"

          publicar() {
            local ref="$1" corpo="$2"
            local codigo
            codigo="$(curl -sS -o resposta.json -w '%{http_code}' \
              -X POST "https://api.supabase.com/v1/projects/${ref}/secrets" \
              -H "Authorization: Bearer ${ACCESS_TOKEN}" \
              -H 'Content-Type: application/json' \
              -d "${corpo}")"
            if [[ "${codigo}" != "200" && "${codigo}" != "201" ]]; then
              echo "::error::Management API respondeu ${codigo} ao publicar em ${ref}."
              head -c 800 resposta.json || true
              rm -f resposta.json
              exit 1
            fi
            rm -f resposta.json
            echo "publicado em ${ref} (HTTP ${codigo})."
          }

          corpo_champions="$(jq -n --arg a "${segredo_webhook}" --arg b "${segredo_callback}" --arg u "${FINANCE_URL}" \
            '[{name:"PROMO_FINANCE_CREDITO_WEBHOOK_SECRET",value:$a},
              {name:"FINANCE_CREDITO_WEBHOOK_SECRET",value:$b},
              {name:"PROMO_FINANCE_CREDITO_WEBHOOK_URL",value:$u}]')"
          corpo_finance="$(jq -n --arg a "${segredo_webhook}" --arg b "${segredo_callback}" --arg u "${CHAMPIONS_URL}" \
            '[{name:"CHAMPIONS_CREDITO_WEBHOOK_SECRET",value:$a},
              {name:"CHAMPIONS_CREDITO_CALLBACK_SECRET",value:$b},
              {name:"CHAMPIONS_CREDITO_CALLBACK_URL",value:$u}]')"

          publicar "${CHAMPIONS_REF}" "${corpo_champions}"
          publicar "${FINANCE_REF}" "${corpo_finance}"

      - name: Conferir que os secrets existem nos dois projetos
        env:
          ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          {
            echo "### Secrets da integracao de credito provisionados"
            echo ""
          } >> "$GITHUB_STEP_SUMMARY"
          for par in "${CHAMPIONS_REF}:${NOMES_CHAMPIONS}" "${FINANCE_REF}:${NOMES_FINANCE}"; do
            ref="${par%%:*}"; nomes="${par#*:}"
            codigo="$(curl -sS -o nomes.json -w '%{http_code}' \
              "https://api.supabase.com/v1/projects/${ref}/secrets" \
              -H "Authorization: Bearer ${ACCESS_TOKEN}")"
            if [[ "${codigo}" != "200" ]]; then
              echo "::error::GET secrets de ${ref} respondeu ${codigo}; nao da para confirmar."
              exit 1
            fi
            read -r -a lista <<< "${nomes}"
            for nome in "${lista[@]}"; do
              if ! jq -e --arg n "${nome}" 'map(.name) | index($n) != null' nomes.json >/dev/null; then
                echo "::error::${nome} nao aparece em ${ref} apos a publicacao."
                exit 1
              fi
            done
            rm -f nomes.json
            {
              echo "Projeto \`${ref}\` (somente nomes):"
              echo ""
              echo '```'
              printf '%s\n' "${lista[@]}"
              echo '```'
              echo ""
            } >> "$GITHUB_STEP_SUMMARY"
          done
