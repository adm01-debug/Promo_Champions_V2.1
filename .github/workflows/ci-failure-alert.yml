name: CI Failure Alert

# Dispara quando qualquer workflow termina na branch main com falha e avisa o
# N8N (que roteia para WhatsApp/Slack conforme configurado lá). O secret
# N8N_ALERT_WEBHOOK_URL precisa ser criado manualmente no repo; sem ele o job
# apenas loga e sai verde, sem quebrar nada.

on:
  workflow_run:
    workflows:
      - "PR Checks"
      - "CodeQL"
      - "Release Please"
      - "Migrations Drift"
      - "DB Backup (off-site)"
      - "PR Review SLA"
      - "Dependabot Auto-merge"
      - "Apply Migration"
      - "Edge Functions Bundle Check"
      - "Edge Functions Input Validation Lint"
      - "Edge Functions X-Request-Id Lint"
      - "Cron Monitoring Regression"
      - "QA Exhaustive (Weekly)"
      - "CI/CD — Post-merge Main"
      - "Graphify Foundation"
      - "Deploy Pipeline"
      - "A11y Sweep (UI PRs)"
      - "DB Probe (read-only)"
      - "Quote-to-Sale Guard Rails"
    types: [completed]
    # Sem este filtro, toda run concluída dos workflows acima — em qualquer
    # branch (inclusive PRs) — enfileirava um run do alerta, que só depois era
    # descartado pelo guard no step. Com dezenas de PRs ativos isso lotava a
    # fila de Actions com centenas de runs que nunca alertavam nada.
    # As tags v*/promo-champions-v2-v* entram porque o Deploy Pipeline dispara
    # por push de tag — head_branch é o nome da tag, e a falha de um deploy de
    # release precisa alertar igual (o step restringe tag ao Deploy Pipeline).
    branches: [main, 'v*', 'promo-champions-v2-v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  alert:
    name: Notify N8N on main failure
    runs-on: ubuntu-latest
    timeout-minutes: 3
    # Sem job-level if: quando todos os jobs ficam skipped, o GitHub Actions
    # marca o workflow como "failure". A guarda foi movida para dentro do step.
    steps:
      - name: POST alerta para o webhook do N8N
        env:
          N8N_ALERT_WEBHOOK_URL: ${{ secrets.N8N_ALERT_WEBHOOK_URL }}
          N8N_ALERT_WEBHOOK_SECRET: ${{ secrets.N8N_ALERT_WEBHOOK_SECRET }}
          GH_REPO: ${{ github.repository }}
          GH_WORKFLOW: ${{ github.event.workflow_run.name }}
          GH_BRANCH: ${{ github.event.workflow_run.head_branch }}
          WF_HEAD_REPO: ${{ github.event.workflow_run.head_repository.full_name }}
          GH_SHA: ${{ github.event.workflow_run.head_sha }}
          GH_RUN_URL: ${{ github.event.workflow_run.html_url }}
          GH_ACTOR: ${{ github.event.workflow_run.actor.login }}
          WF_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
        run: |
          # Guarda equivalente ao antigo job-level if — sai 0 quando o evento
          # não requer alerta, evitando falha por "todos os jobs skipped".
          if [[ "$WF_CONCLUSION" != "failure" ]] || \
             [[ "$GH_WORKFLOW" == "CI Failure Alert" ]] || \
             [[ -n "$WF_HEAD_REPO" && "$WF_HEAD_REPO" != "$GH_REPO" ]]; then
            echo "Sem alerta necessário (conclusão=$WF_CONCLUSION, branch=$GH_BRANCH, workflow=$GH_WORKFLOW)."
            exit 0
          fi
          # Branch elegível: main para qualquer workflow; fora da main só o
          # Deploy Pipeline em tag de release — ele dispara por push de tag e
          # head_branch é o nome da tag, não "main".
          if [[ "$GH_BRANCH" != "main" ]]; then
            if [[ "$GH_WORKFLOW" != "Deploy Pipeline" ]] || \
               [[ "$GH_BRANCH" != v* && "$GH_BRANCH" != promo-champions-v2-v* ]]; then
              echo "Sem alerta necessário (branch=$GH_BRANCH, workflow=$GH_WORKFLOW)."
              exit 0
            fi
          fi
          if [ -z "$N8N_ALERT_WEBHOOK_URL" ]; then
            echo "N8N_ALERT_WEBHOOK_URL não configurado — pulando alerta."
            exit 0
          fi
          # jq -n monta o JSON com escaping correto — interpolação de shell
          # quebrava o payload quando workflow/actor continham aspas.
          payload="$(jq -n \
            --arg event ci_failure \
            --arg repo "$GH_REPO" \
            --arg workflow "$GH_WORKFLOW" \
            --arg branch "$GH_BRANCH" \
            --arg sha "$GH_SHA" \
            --arg actor "$GH_ACTOR" \
            --arg run_url "$GH_RUN_URL" \
            '{event: $event, repo: $repo, workflow: $workflow, branch: $branch, sha: $sha, actor: $actor, run_url: $run_url}')"
          args=(-fsS -X POST -H 'Content-Type: application/json')
          # Segredo compartilhado opcional: o N8N valida o header quando o
          # secret N8N_ALERT_WEBHOOK_SECRET existir no repo.
          if [ -n "$N8N_ALERT_WEBHOOK_SECRET" ]; then
            args+=(-H "x-webhook-secret: $N8N_ALERT_WEBHOOK_SECRET")
          fi
          curl "${args[@]}" -d "$payload" "$N8N_ALERT_WEBHOOK_URL"
