name: CI Failure Alert

# Dispara quando qualquer workflow termina na branch main com falha e avisa o
# N8N (que roteia para WhatsApp/Slack conforme configurado lá). O secret
# N8N_ALERT_WEBHOOK_URL precisa ser criado manualmente no repo; sem ele o job
# apenas loga e sai verde, sem quebrar nada.

on:
  workflow_run:
    types: [completed]

permissions:
  contents: read

jobs:
  alert:
    name: Notify N8N on main failure
    runs-on: ubuntu-latest
    timeout-minutes: 3
    if: >-
      github.event.workflow_run.conclusion == 'failure' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.name != 'CI Failure Alert'
    steps:
      - name: POST alerta para o webhook do N8N
        env:
          N8N_ALERT_WEBHOOK_URL: ${{ secrets.N8N_ALERT_WEBHOOK_URL }}
          GH_REPO: ${{ github.repository }}
          GH_WORKFLOW: ${{ github.event.workflow_run.name }}
          GH_BRANCH: ${{ github.event.workflow_run.head_branch }}
          GH_SHA: ${{ github.event.workflow_run.head_sha }}
          GH_RUN_URL: ${{ github.event.workflow_run.html_url }}
          GH_ACTOR: ${{ github.event.workflow_run.actor.login }}
        run: |
          if [ -z "$N8N_ALERT_WEBHOOK_URL" ]; then
            echo "N8N_ALERT_WEBHOOK_URL não configurado — pulando alerta."
            exit 0
          fi
          curl -fsS -X POST -H 'Content-Type: application/json' \
            -d "{\"event\":\"ci_failure\",\"repo\":\"$GH_REPO\",\"workflow\":\"$GH_WORKFLOW\",\"branch\":\"$GH_BRANCH\",\"sha\":\"$GH_SHA\",\"actor\":\"$GH_ACTOR\",\"run_url\":\"$GH_RUN_URL\"}" \
            "$N8N_ALERT_WEBHOOK_URL"
