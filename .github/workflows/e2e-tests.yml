name: E2E Tests

# Workflow desabilitado temporariamente - testes E2E foram removidos
# Será reativado quando os testes E2E forem recriados (Issue #25)

on:
  workflow_dispatch:  # Manual apenas

env:
  CI: true

jobs:
  e2e-tests:
    name: Run E2E Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Info
        run: echo "E2E tests temporariamente desabilitados - Issue #25"
        
