name: DB Backup (off-site)

# Backup agendado do Postgres de produção via pg_dump, diário às 03:00 UTC.
#
# O passo real só roda quando o secret SUPABASE_DB_URL está configurado
# (connection string Postgres completa, ex:
#   postgresql://postgres.[PROJECT-REF]:[PASSWORD]@aws-0-[region].pooler.supabase.com:6543/postgres
# — gerada em Supabase Dashboard → Settings → Database → Connection string).
# Sem o secret, o job é informativo: documenta o passo e sai verde.
#
# Retenção: o dump sobe como artifact com retenção curta (7 dias) — o objetivo
# é ter um recovery point recente sempre disponível, não um arquivo histórico
# no GitHub. Para retenção longa/off-site real, mover o artifact para um
# bucket S3/GCS (passo comentado no fim) ou contratar o backup gerenciado
# do Supabase (ver docs/SIZING.md).

on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: db-backup
  cancel-in-progress: false

jobs:
  backup:
    runs-on: ubuntu-latest
    # pg_dump exige major do cliente >= major do servidor. O Supabase roda
    # Postgres 17 — a tag do `docker run` abaixo precisa acompanhar essa major.
    # (O job NÃO pode usar `container: postgres:17`: upload-artifact precisa do
    # Node do runner, que a imagem postgres não tem.)
    timeout-minutes: 30
    env:
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
      BACKUP_ENCRYPTION_KEY: ${{ secrets.BACKUP_ENCRYPTION_KEY }}
    steps:
      - name: Verificar secret e projeto alvo
        id: gate
        run: |
          if [ -z "$SUPABASE_DB_URL" ]; then
            echo "Para ativar: Settings → Secrets → SUPABASE_DB_URL com a"
            echo "connection string do pooler (porta 6543) do projeto usyxfpqlsspldubptrdl."
            # No agendamento diário, ausência do secret é falha — senão o job
            # fica verde para sempre sem nunca ter feito um backup.
            if [ "${{ github.event_name }}" = "schedule" ]; then
              echo "::error::SUPABASE_DB_URL não configurado — backup agendado não pode ficar verde sem fazer nada."
              exit 1
            fi
            echo "::warning::SUPABASE_DB_URL não configurado — backup pulado."
            echo "run=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Uma URL válida para OUTRO Postgres produziria um dump de sucesso
          # do banco errado — o ref do projeto precisa estar na URL.
          case "$SUPABASE_DB_URL" in
            *usyxfpqlsspldubptrdl*) ;;
            *) echo "::error::SUPABASE_DB_URL não aponta para o projeto usyxfpqlsspldubptrdl — backup abortado para não capturar o banco errado."
               exit 1 ;;
          esac
          echo "run=true" >> "$GITHUB_OUTPUT"

      - name: Conferir versão e conectividade do servidor
        if: steps.gate.outputs.run == 'true'
        run: |
          # Sem || true: se não conecta, o dump falharia adiante — falha aqui.
          SERVER_VER=$(docker run --rm -e SUPABASE_DB_URL postgres:17.6 \
            sh -c 'psql "$SUPABASE_DB_URL" -tAc "SHOW server_version"')
          echo "server_version=$SERVER_VER"
          docker run --rm postgres:17.6 pg_dump --version

      - name: pg_dump → artifact
        if: steps.gate.outputs.run == 'true'
        run: |
          set -euo pipefail
          STAMP=$(date -u +%Y%m%dT%H%M%SZ)
          FILE="promo-champions-db-${STAMP}.dump"
          # A URL (com senha) entra por env, não por argv do pg_dump.
          # --user: sem ele o dump sai root-owned no workspace e o runner
          # falha ao sobrescrever/remover o arquivo nos passos seguintes.
          docker run --rm --user "$(id -u):$(id -g)" \
            -e SUPABASE_DB_URL -e FILE="$FILE" \
            -v "$GITHUB_WORKSPACE:/out" postgres:17.6 \
            sh -c 'pg_dump "$SUPABASE_DB_URL" \
              --format=custom --compress=9 --no-owner --no-privileges \
              --file="/out/$FILE"'
          # Dump de produção expõe dados reais em artifact — criptografia
          # obrigatória: sem BACKUP_ENCRYPTION_KEY o job falha em vez de
          # subir o banco inteiro em claro (mesma regra do gate de secret).
          if [ -z "$BACKUP_ENCRYPTION_KEY" ]; then
            shred -u "$FILE" 2>/dev/null || rm -f "$FILE"
            echo "::error::BACKUP_ENCRYPTION_KEY não configurado — backup abortado em vez de subir dump sem criptografia. Configure o secret em Settings → Secrets."
            exit 1
          fi
          openssl enc -aes-256-cbc -pbkdf2 -in "$FILE" -out "$FILE.enc" \
            -pass env:BACKUP_ENCRYPTION_KEY
          shred -u "$FILE"
          FILE="$FILE.enc"
          echo "BACKUP_FILE=$FILE" >> "$GITHUB_ENV"
          ls -lh "$FILE"

      - name: Upload artifact (retenção 7 dias)
        if: steps.gate.outputs.run == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: db-backup-${{ github.run_id }}
          path: promo-champions-db-*.dump*
          retention-days: 7

      # Off-site real (ex.: S3): descomentar quando os secrets AWS existirem.
      # - name: Upload para bucket off-site
      #   if: steps.gate.outputs.run == 'true'
      #   env:
      #     AWS_ACCESS_KEY_ID: ${{ secrets.AWS_BACKUP_ACCESS_KEY_ID }}
      #     AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_BACKUP_SECRET_ACCESS_KEY }}
      #   run: aws s3 cp "$BACKUP_FILE" s3://promo-backups/db/
