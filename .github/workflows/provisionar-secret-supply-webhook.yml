# docs:
#   gatilho: dispatch manual com confirmacao APLICAR; roda so quando o dono decidir publicar o segredo
#   prova: a Management API responde 200/201 no POST e o GET seguinte lista PROMO_SUPPLY_WEBHOOK_SECRET no projeto oficial
#   falha: 403/erro da API deixa o job vermelho e nenhum valor e' gravado parcialmente (uma chamada, um payload)
#   avisa: o resumo do run lista apenas NOMES de secrets, nunca valores
# nao-e-bug:
#   - sem-eco-de-valor: o segredo chega por secrets do repositorio e nunca aparece no log
#   - sem-geracao: gerar o valor aqui invalidaria o segredo configurado no lado emissor (Promo Supply)
# ==================================================================
# PROMO CHAMPIONS - Provisionar o segredo do webhook receive-os-sync
# ==================================================================
# Por que existe: a edge supply-dispatch falha fechada com 503
# ("supply_secret_missing") enquanto PROMO_SUPPLY_WEBHOOK_SECRET nao existir no
# projeto, e a fila fica intacta (nada e' consumido sem assinatura).
# O valor e' gerado aqui e replicado no lado receptor (Promo Supply, como
# PROMO_CHAMPIONS_WEBHOOK_SECRET) pelo secret do repositorio
# PROMO_SUPPLY_WEBHOOK_SECRET, que e' a fonte unica - os dois lados precisam do
# mesmo valor para o HMAC fechar.

name: Provisionar secret do webhook Promo Supply

on:
  workflow_dispatch:
    inputs:
      confirmacao:
        description: 'Digite APLICAR para publicar PROMO_SUPPLY_WEBHOOK_SECRET no projeto oficial'
        required: true

defaults:
  run:
    shell: bash --noprofile --norc -euo pipefail {0}

permissions:
  contents: read

concurrency:
  group: provisionar-secret-supply-webhook
  cancel-in-progress: false

jobs:
  provisionar:
    name: Publicar PROMO_SUPPLY_WEBHOOK_SECRET
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PROJECT_REF_ESPERADO: usyxfpqlsspldubptrdl
    steps:
      - name: Validar a entrada e as credenciais
        env:
          CONFIRMACAO: ${{ inputs.confirmacao }}
          ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          WEBHOOK_SECRET: ${{ secrets.PROMO_SUPPLY_WEBHOOK_SECRET }}
        run: |
          if [[ "${CONFIRMACAO}" != "APLICAR" ]]; then
            echo "::error::confirmacao diferente de APLICAR. Nada foi publicado."
            exit 1
          fi
          faltando=()
          [[ -n "${ACCESS_TOKEN}" ]] || faltando+=("SUPABASE_ACCESS_TOKEN")
          [[ -n "${WEBHOOK_SECRET}" ]] || faltando+=("PROMO_SUPPLY_WEBHOOK_SECRET")
          if (( ${#faltando[@]} > 0 )); then
            echo "::error::faltando: ${faltando[*]}"
            exit 1
          fi
          echo "credenciais presentes; nada sera ecoado."

      - name: Publicar o secret
        env:
          ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          WEBHOOK_SECRET: ${{ secrets.PROMO_SUPPLY_WEBHOOK_SECRET }}
        run: |
          corpo="$(jq -n --arg v "${WEBHOOK_SECRET}" \
            '[{name:"PROMO_SUPPLY_WEBHOOK_SECRET",value:$v}]')"
          codigo="$(curl -sS -o resposta.json -w '%{http_code}' \
            -X POST "https://api.supabase.com/v1/projects/${PROJECT_REF_ESPERADO}/secrets" \
            -H "Authorization: Bearer ${ACCESS_TOKEN}" \
            -H 'Content-Type: application/json' \
            -d "${corpo}")"
          if [[ "${codigo}" != "200" && "${codigo}" != "201" ]]; then
            echo "::error::Management API respondeu ${codigo} ao publicar o secret. Nada foi assumido como aplicado."
            head -c 800 resposta.json || true
            exit 1
          fi
          echo "secret publicada (HTTP ${codigo})."
          rm -f resposta.json

      - name: Conferir que o secret existe no projeto
        env:
          ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          codigo="$(curl -sS -o nomes.json -w '%{http_code}' \
            "https://api.supabase.com/v1/projects/${PROJECT_REF_ESPERADO}/secrets" \
            -H "Authorization: Bearer ${ACCESS_TOKEN}")"
          if [[ "${codigo}" != "200" ]]; then
            echo "::error::GET secrets respondeu ${codigo}; nao da para confirmar a publicacao."
            exit 1
          fi
          presentes="$(jq -r '[.[].name] | sort | .[]' nomes.json | grep -E '^PROMO_SUPPLY_WEBHOOK_SECRET$' || true)"
          rm -f nomes.json
          if [[ -z "${presentes}" ]]; then
            echo "::error::PROMO_SUPPLY_WEBHOOK_SECRET nao aparece no projeto apos a publicacao."
            exit 1
          fi
          {
            echo "### Secret de integracao provisionado"
            echo ""
            echo "Projeto: \`${PROJECT_REF_ESPERADO}\`"
            echo ""
            echo "Secrets presentes (somente nomes):"
            echo ""
            echo '```'
            echo "${presentes}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"