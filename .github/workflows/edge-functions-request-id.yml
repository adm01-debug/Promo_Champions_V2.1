name: Edge Functions X-Request-Id Lint

on:
  push:
    branches: [main]
    paths:
      - 'supabase/functions/**'
      - 'scripts/lint-request-id.ts'
      - 'scripts/request-id-lint-allowlist.txt'
      - '.github/workflows/edge-functions-request-id.yml'
      - 'deno.lock'
      - 'deno.json'
      - 'package.json'
  pull_request:
    branches: [main]
    paths:
      - 'supabase/functions/**'
      - 'scripts/lint-request-id.ts'
      - 'scripts/request-id-lint-allowlist.txt'
      - '.github/workflows/edge-functions-request-id.yml'
      - 'deno.lock'
      - 'deno.json'
      - 'package.json'

permissions:
  contents: read

concurrency:
  group: request-id-lint-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: withRequestId adoption lint + propagation fuzz
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.9.x

      - name: Lockfile drift check
        run: |
          deno install --frozen=false
          if ! git diff --exit-code deno.lock; then
            echo "::error::deno.lock desatualizado — rode 'deno install --frozen=false' localmente e commite o lockfile"
            exit 1
          fi

      - name: Lint — block Deno.serve without withRequestId
        run: deno run --frozen --allow-read scripts/lint-request-id.ts

      - name: Fuzz — hundreds of X-Request-Id propagation scenarios
        run: deno test --frozen --node-modules-dir=none --allow-read supabase/functions/_shared/request-id-fuzz_test.ts
