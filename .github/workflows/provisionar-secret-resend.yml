# docs:
#   gatilho: dispatch manual com confirmacao APLICAR; roda so quando o dono decidir publicar o segredo
#   prova: a Management API responde 200/201 no POST e o GET seguinte lista RESEND_API_KEY no projeto oficial
#   falha: 403/erro da API deixa o job vermelho e nenhum valor e' gravado parcialmente (uma chamada, um payload)
#   avisa: o resumo do run lista apenas NOMES de secrets, nunca valores
# nao-e-bug:
#   - sem-eco-de-valor: o segredo chega por secrets do repositorio e nunca aparece no log
#   - sem-geracao: gerar o valor aqui invalidaria a conta Resend; a fonte unica e' o secret do repositorio
# ==================================================================
# PROMO CHAMPIONS - Provisionar RESEND_API_KEY nas edge functions
# ==================================================================
# Por que existe: access-denied-alerts, broadcast-sale-notification e
# activity-goal-alerts falham fechadas com 503 ("RESEND_API_KEY not configured")
# porque o segredo existe no repositorio mas nao no projeto Supabase.

name: Provisionar secret do Resend

on:
  workflow_dispatch:
    inputs:
      confirmacao:
        description: 'Digite APLICAR para publicar RESEND_API_KEY no projeto oficial'
        required: true

defaults:
  run:
    shell: bash --noprofile --norc -euo pipefail {0}

permissions:
  contents: read

concurrency:
  group: provisionar-secret-resend
  cancel-in-progress: false

jobs:
  provisionar:
    name: Publicar RESEND_API_KEY
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PROJECT_REF_ESPERADO: usyxfpqlsspldubptrdl
    steps:
      - name: Validar a entrada e as credenciais
        env:
          CONFIRMACAO: ${{ inputs.confirmacao }}
          ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          RESEND_KEY: ${{ secrets.RESEND_API_KEY }}
        run: |
          if [[ "${CONFIRMACAO}" != "APLICAR" ]]; then
            echo "::error::confirmacao diferente de APLICAR. Nada foi publicado."
            exit 1
          fi
          faltando=()
          [[ -n "${ACCESS_TOKEN}" ]] || faltando+=("SUPABASE_ACCESS_TOKEN")
          [[ -n "${RESEND_KEY}" ]] || faltando+=("RESEND_API_KEY")
          if (( ${#faltando[@]} > 0 )); then
            echo "::error::faltando: ${faltando[*]}"
            exit 1
          fi
          echo "credenciais presentes; nada sera ecoado."

      - name: Publicar o secret
        env:
          ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          RESEND_KEY: ${{ secrets.RESEND_API_KEY }}
        run: |
          corpo="$(jq -n --arg v "${RESEND_KEY}" \
            '[{name:"RESEND_API_KEY",value:$v}]')"
          codigo="$(curl -sS -o resposta.json -w '%{http_code}' \
            -X POST "https://api.supabase.com/v1/projects/${PROJECT_REF_ESPERADO}/secrets" \
            -H "Authorization: Bearer ${ACCESS_TOKEN}" \
            -H 'Content-Type: application/json' \
            -d "${corpo}")"
          if [[ "${codigo}" != "200" && "${codigo}" != "201" ]]; then
            echo "::error::Management API respondeu ${codigo} ao publicar o secret. Nada foi assumido como aplicado."
            head -c 800 resposta.json || true
            exit 1
          fi
          echo "secret publicada (HTTP ${codigo})."
          rm -f resposta.json

      - name: Conferir que o secret existe no projeto
        env:
          ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          codigo="$(curl -sS -o nomes.json -w '%{http_code}' \
            "https://api.supabase.com/v1/projects/${PROJECT_REF_ESPERADO}/secrets" \
            -H "Authorization: Bearer ${ACCESS_TOKEN}")"
          if [[ "${codigo}" != "200" ]]; then
            echo "::error::GET secrets respondeu ${codigo}; nao da para confirmar a publicacao."
            exit 1
          fi
          presentes="$(jq -r '[.[].name] | sort | .[]' nomes.json | grep -E '^RESEND_API_KEY$' || true)"
          rm -f nomes.json
          if [[ -z "${presentes}" ]]; then
            echo "::error::RESEND_API_KEY nao aparece no projeto apos a publicacao."
            exit 1
          fi
          {
            echo "### Secret do Resend provisionado"
            echo ""
            echo "Projeto: \`${PROJECT_REF_ESPERADO}\`"
            echo ""
            echo "Secrets presentes (somente nomes):"
            echo ""
            echo '```'
            echo "${presentes}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
