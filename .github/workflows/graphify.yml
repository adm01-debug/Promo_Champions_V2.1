name: Graphify Foundation

on:
  pull_request:
    paths:
      - 'src/lib/revenueForecast/**'
      - 'tools/graphify/**'
      - 'scripts/graphify/**'
      - 'package.json'
      - 'tsconfig*.json'
      - '.github/workflows/graphify.yml'
  push:
    branches: [main]
    paths:
      - 'src/lib/revenueForecast/**'
      - 'tools/graphify/**'
      - 'scripts/graphify/**'
      - 'package.json'
      - 'tsconfig*.json'
      - '.github/workflows/graphify.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: graphify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  foundation:
    name: Graphify Foundation
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      HUSKY: 0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package-lock.json
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: "3.12"
      - run: npm ci
      - run: uv sync --directory tools/graphify --locked
      - run: tools/graphify/.venv/bin/graphify --version
      - run: npm run graphify:test
      - run: node scripts/graphify/extract-code-only.mjs --scope src/lib/revenueForecast --out .graphify-local/ci-smoke --max-workers 1
