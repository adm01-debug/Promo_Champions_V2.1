name: Graphify Foundation

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: graphify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  foundation:
    name: Graphify Foundation
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      HUSKY: 0
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
      - uses: astral-sh/setup-uv@v5
      - run: npm ci
      - run: uv sync --directory tools/graphify --locked
      - run: tools/graphify/.venv/bin/graphify --version
      - run: npm run graphify:test
      - run: node scripts/graphify/extract-code-only.mjs --scope src/lib/revenueForecast --out .graphify-local/ci-smoke --max-workers 1
