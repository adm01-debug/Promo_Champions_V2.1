name: Cron Monitoring Regression

on:
  pull_request:
    paths:
      - 'supabase/functions/cron-failure-alerter/**'
      - 'supabase/migrations/**cron**'
      - '.github/workflows/cron-monitoring.yml'
  push:
    branches: [main]
    paths:
      - 'supabase/functions/cron-failure-alerter/**'
      - 'supabase/migrations/**cron**'
  schedule:
    # Roda diariamente às 06:00 UTC — captura regressões causadas por mudanças
    # de schema/RLS mesmo sem PR na função de cron.
    - cron: '0 6 * * *'
  workflow_dispatch:

concurrency:
  group: cron-monitoring-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deno-regression:
    name: Deno — cron-failure-alerter suite
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
      VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.2.x

      - name: Sanity check env
        id: env-check
        run: |
          if [ -z "$VITE_SUPABASE_URL" ] || [ -z "$VITE_SUPABASE_PUBLISHABLE_KEY" ]; then
            # O repositório ainda NÃO tem os secrets VITE_SUPABASE_URL/VITE_SUPABASE_PUBLISHABLE_KEY
            # configurados (verificado 2026-09-03). Falhar aqui viraria vermelho
            # diário permanente; quando os secrets forem criados, endurecer este
            # ramo (exit 1 fora de pull_request) para eliminar o verde silencioso.
            echo "::warning::Integration-test secrets absent (${{ github.event_name }}) — live suite SKIPPED, not validated"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Run Deno regression suite
        if: steps.env-check.outputs.skip != 'true'
        run: |
          # Testes de integração (fn_*) precisam de SUPABASE_SERVICE_ROLE_KEY para
          # chamar RPCs via PostgREST. Quando o secret não está configurado no repo
          # rodamos apenas os testes E2E (que chamam a edge function diretamente e
          # passam sem service_role do cliente). Suite completa fica disponível
          # localmente com .env populado.
          if [ -n "$SUPABASE_SERVICE_ROLE_KEY" ]; then
            echo "SERVICE_ROLE presente — rodando suite completa"
            deno test --frozen --node-modules-dir=none \
              --allow-net \
              --allow-env \
              --allow-read \
              supabase/functions/cron-failure-alerter/index.test.ts
          else
            # index.test.ts usa SUPABASE_SERVICE_ROLE_KEY nos headers HTTP dos testes E2E
            # para invocar a edge function. A anon key é suficiente para chamar o endpoint
            # HTTP (a função usa seu próprio service_role internamente).
            echo "::warning::SUPABASE_SERVICE_ROLE_KEY ausente — rodando apenas testes E2E com anon key como auth"
            SUPABASE_SERVICE_ROLE_KEY="$VITE_SUPABASE_PUBLISHABLE_KEY" deno test --frozen --node-modules-dir=none \
              --allow-net \
              --allow-env \
              --allow-read \
              --filter="E2E" \
              supabase/functions/cron-failure-alerter/index.test.ts
          fi

      - name: Upload deno cache on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: deno-logs-${{ github.run_id }}
          path: |
            ~/.cache/deno/
            !~/.cache/deno/deps
          if-no-files-found: ignore
          retention-days: 3
