name: Migrations Drift

# Compara as versões das migrations do repositório com a tabela
# supabase_migrations.schema_migrations do projeto real.
#
# Gate tolerante:
#   - Sem SUPABASE_ACCESS_TOKEN → apenas warning (job não falha).
#   - Com o secret → FALHA se a base tem versão aplicada que não existe como
#     arquivo no repo (DDL aplicada fora do fluxo, violando CLAUDE.md §1).
#   - Versão local ainda não aplicada na base = pendência de deploy: warning.
#
# Roda em todo PR/push que toca supabase/migrations + diariamente (drift por
# mudança manual no dashboard só aparece no agendamento).

on:
  pull_request:
    paths:
      - 'supabase/migrations/**'
      - '.github/workflows/migrations-drift.yml'
  push:
    branches: [main]
    paths:
      - 'supabase/migrations/**'
      - '.github/workflows/migrations-drift.yml'
  schedule:
    - cron: '0 7 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: migrations-drift-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  drift:
    name: Repo vs supabase_migrations
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@45a513f8c64c0bc8e0e3dfe572b5c95be85f6359 # v3
        with:
          version: latest

      - name: Drift check
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::warning::SUPABASE_ACCESS_TOKEN não configurado — drift check pulado (gate informativo)."
            exit 0
          fi

          supabase link --project-ref usyxfpqlsspldubptrdl

          # Colunas: Local | Remote | Time (UTC). Só a coluna Remote importa:
          # o lado local é derivado dos arquivos do repo (abaixo).
          supabase migration list > /tmp/migration_list.txt
          cat /tmp/migration_list.txt

          # A posição da coluna Remote é detectada pelo cabeçalho — se o CLI
          # inverter/reordenar colunas, ler $2 fixo compararia o lado errado
          # e o drift real passaria batido (falso negativo).
          HEADER=$(grep -im1 'remote' /tmp/migration_list.txt || true)
          REMOTE_COL=$(printf '%s' "$HEADER" | awk -F'[|│]' '{for(i=1;i<=NF;i++){gsub(/[ \t]/,"",$i); if(tolower($i) ~ /^remote/) {print i; exit}}}')
          if [ -z "$REMOTE_COL" ]; then
            echo "::error::Cabeçalho de 'supabase migration list' não tem coluna 'Remote' identificável — formato do CLI mudou. Drift check cego não pode aprovar."
            exit 1
          fi

          awk -F'[|│]' -v col="$REMOTE_COL" '{v=$col; gsub(/[^0-9]/,"",v); if(v ~ /^[0-9]{8,}$/) print v}' \
            /tmp/migration_list.txt | sort -u > /tmp/remote_versions.txt

          # Gate cego = falso negativo garantido: se o parser extraiu zero
          # versões (CLI mudou formato ou falhou), o check não pode passar.
          if [ ! -s /tmp/remote_versions.txt ]; then
            echo "::error::Nenhuma versão remota extraída de 'supabase migration list' — formato do CLI pode ter mudado ou a consulta falhou. Drift check cego não pode aprovar."
            exit 1
          fi

          # Versões do repo (prefixo antes do primeiro "_").
          ls supabase/migrations | sed 's/_.*\.sql$//' | sort -u > /tmp/repo_versions.txt

          echo "--- Versões na base sem arquivo no repo (DRIFT — gate falha) ---"
          DRIFT=$(comm -13 /tmp/repo_versions.txt /tmp/remote_versions.txt)
          # Versões legadas aplicadas antes da disciplina de migrations
          # versionadas (faixa 2026-05 a 2026-07, era Lovable/dashboard) são
          # reconciliadas em scripts/db-audit/legacy-ledger-versions.txt —
          # não contam como drift. Drift NOVO (fora da lista) segue falhando.
          if [ -f scripts/db-audit/legacy-ledger-versions.txt ]; then
            DRIFT=$(printf '%s\n' "$DRIFT" | grep -vxF -f scripts/db-audit/legacy-ledger-versions.txt || true)
          fi
          echo "$DRIFT"

          echo "--- Versões no repo ainda não aplicadas (pendência de deploy — só aviso) ---"
          comm -23 /tmp/repo_versions.txt /tmp/remote_versions.txt

          if [ -n "$DRIFT" ]; then
            echo "::error::A base tem migrations aplicadas sem arquivo no repo. Reconcilie gerando arquivos de migração, revertendo a DDL manual ou documentando versão legada em scripts/db-audit/legacy-ledger-versions.txt."
            exit 1
          fi
