name: Release Please

# CHANGELOG automático + tags semânticas a partir de conventional commits.
# Em cada push na main, o release-please abre/atualiza uma PR "chore: release"
# com o CHANGELOG e a próxima versão; ao mergear, cria o GitHub Release e a
# tag v*.*.* — que por sua vez dispara o Deploy Pipeline (deploy.yml).

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: release-please
  cancel-in-progress: false

jobs:
  release-please:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
