name: PR Checks

# Pipeline canônico de qualidade (consolidação de lint.yml + enterprise-quality.yml,
# que rodavam os mesmos gates em duplicidade no mesmo PR).
# - pull_request → gate completo (lint, types, secrets, tests+coverage, deno lint,
#   e2e, build, lighthouse, bundle)
# - push em main → gates essenciais (lint, types, tests, build), sem os jobs pesados
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  actions: write

# Um run por ref: push novo na mesma PR cancela o run anterior. push:main
# nunca cancela outro push:main (ambos apontam para refs/heads/main — cancel
# bloquearia runs legítimos de deploys consecutivos).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  detect-changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    timeout-minutes: 3
    outputs:
      has-code: ${{ steps.check.outputs.has_code }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - id: check
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            echo "has_code=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          BASE="${{ github.event.pull_request.base.sha }}"
          HEAD="${{ github.sha }}"
          CHANGED=$(git diff --name-only "$BASE" "$HEAD" \
            | grep -v '^docs/' \
            | grep -v '\.md$' \
            | grep -v '^\.github/CODEOWNERS$' || true)
          if [ -n "$CHANGED" ]; then
            echo "has_code=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_code=false" >> "$GITHUB_OUTPUT"
            echo "PR contém apenas docs/markdown — pulando jobs de código."
          fi

  lint-and-typecheck:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: detect-changes
    if: needs.detect-changes.outputs.has-code == 'true'
    env:
      HUSKY: 0

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      # O guard e o teto (126, calibrado em 2026-09) rodavam só no qa-exhaustive.yml
      # semanal — a baseline podia crescer por até 7 dias sem que nenhuma PR percebesse.
      # Roda por PR agora; o teto só desce (ajuste scripts/../--max-warnings
      # ao consertar violações, nunca ao adicionar novas).
      - name: Complexity & file-length ratchet
        run: npm run lint:complexity

      - name: Run TypeScript check
        run: npm run typecheck

      # Gate de formatação: depois do Prettier em massa (PR de higiene),
      # nenhum arquivo de src/ pode regredir de formato.
      - name: Prettier format check
        run: npm run format:check

      # Flags estritas ainda não zeradas (noUncheckedIndexedAccess, noUnused*):
      # roda tsc com tsconfig.strict.json e reprova só erros NOVOS vs a baseline
      # em scripts/typecheck-baseline.json (ver docs/TYPE_DEBT.md).
      - name: Strict typecheck ratchet (baseline)
        run: npm run typecheck:baseline
      - name: Committed secrets scan
        run: npm run security:secrets

      # dependency-cruiser (ciclos, violação de camada, imports prod→test) rodava
      # só no qa-exhaustive semanal — uma violação podia viver em main até 7
      # dias. Roda em toda PR agora, como parte do gate obrigatório.
      - name: Dependency Cruiser — camadas e ciclos
        run: npm run deps:check

      - name: Graphify wrapper tests
        run: npm run graphify:test

  # Gate de higiene de migrations (pacote auditoria DB/integridade):
  # nomenclatura ^\d{8,14}_.*\.sql$, versões únicas, sem arquivo vazio; em PR,
  # migration nova exige versão estritamente maior que a base, CREATE TABLE
  # exige ENABLE ROW LEVEL SECURITY e literais *.supabase.co / 'eyJhbGci'
  # são proibidos. Regras de diff só rodam com a base disponível (fetch-depth: 0).
  migrations-gate:
    name: Migrations Gate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      HUSKY: 0
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '22'

      - name: Validate migrations
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            node scripts/check-migrations.mjs --base "origin/${{ github.base_ref }}"
          else
            node scripts/check-migrations.mjs
          fi

  # Job próprio, FORA dos required checks do ruleset: npm audit consulta o
  # advisory DB em tempo de execução — um advisory novo ficaria vermelho e,
  # como required, bloquearia todo merge (inclusive a PR do próprio fix).
  security-audit:
    name: Security Audit (production deps)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: detect-changes
    if: needs.detect-changes.outputs.has-code == 'true'
    env:
      HUSKY: 0
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: npm audit
        run: npm audit --omit=dev --audit-level=high

  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: lint-and-typecheck
    env:
      HUSKY: 0

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      # Garante que todo padrão declarado nos configs casa specs reais e que
      # nenhum spec no disco ficou fora de todos os padrões (drift silencioso).
      - name: Test config drift guard
        run: npm run test:config

      # --retry=2 + JSON por spec alimentam o relatório de flakies: um teste que
      # só passa na retentativa fica registrado (retry>0) em vez de passar
      # silenciosamente. O gate final é do flaky-report, não do exit do vitest.
      - name: Run Unit Tests (with coverage gate + retry)
        run: |
          set +e
          npx vitest run --coverage --retry=2 \
            --reporter=default --reporter=json \
            --outputFile.json=test-results/vitest.json
          echo "VITEST_EXIT=$?" >> "$GITHUB_ENV"
          set -e

      # Specs em tests/flaky-quarantine.json rodam mas não reprovam (warn +
      # prazo); flakes (retry>0) viram ::warning:: + relatório; falha real
      # reprova aqui — inclusive crash do vitest sem JSON válido.
      - name: Flaky report + quarantine gate
        run: |
          node scripts/flaky-report.mjs \
            --input test-results/vitest.json \
            --output test-results/flaky-report.md \
            --vitest-exit "$VITEST_EXIT"
          cat test-results/flaky-report.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload flaky report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: flaky-report
          path: test-results/flaky-report.md
          if-no-files-found: ignore
          retention-days: 30

      # O threshold do vitest.config.ts media 16 arquivos escolhidos a dedo
      # (99,9% de <1% do código) e circulava como se fosse a cobertura do sistema.
      # O escopo é src/** inteiro e este passo garante que o número real só sobe.
      - name: Coverage ratchet (nunca cai)
        run: npm run coverage:ratchet

      # Escada: o ratchet global pode diluir uma queda num módulo crítico.
      # Pisos por módulo em coverage-ladder-baseline.json reprovam isso.
      - name: Coverage ladder (pisos por módulo crítico)
        run: npm run coverage:ladder

  edge-functions-lint:
    name: Edge Functions Lint (deno)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: detect-changes
    if: needs.detect-changes.outputs.has-code == 'true'
    env:
      HUSKY: 0

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Deno
        uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2
        with:
          # Pinado na minor: uma major/minor nova pode trazer regra de lint e
          # quebrar o gate sem mudança de código.
          deno-version: v2.9.x

      - name: Lockfile drift check
        run: |
          deno install --frozen=false
          if ! git diff --exit-code deno.lock; then
            echo "::error::deno.lock desatualizado — rode 'deno install --frozen=false' localmente e commite o lockfile"
            exit 1
          fi

      - name: Deno lint (supabase/functions)
        run: deno lint

      # Lint não pega erro de tipo. O check real sai pelo deno task check —
      # o gate roda via ratchet: existem 58 erros legados em 31 arquivos
      # (scripts/deno-typecheck-baseline.json); erro novo em arquivo limpo ou
      # total acima da baseline reprova a PR, e a baseline só desce.
      - name: Deno type-check (supabase/functions, ratchet)
        run: node scripts/check-deno-types.mjs

  # Suíte Deno completa das edge functions. Antes só cron-failure-alerter
  # rodava (cron-monitoring.yml); os outros ~80 arquivos *_test.ts/*.test.ts
  # nunca executavam em CI. Dois tiers via scripts/deno-test-suite.mjs:
  #   unit — self-contained, reprova em qualquer falha;
  #   live — manifesto tests/deno-live-tests.json (precisa de backend/secrets);
  #          sem secrets pula com ::warning:: listando as suites, e falhas de
  #          credencial inválida ('Invalid API key') avisam sem reprovar.
  deno-tests:
    name: Edge Functions Tests (deno)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: detect-changes
    # Forks não recebem secrets — o tier live pularia sempre; unit segue útil.
    if: needs.detect-changes.outputs.has-code == 'true'
    env:
      HUSKY: 0
      VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
      VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Deno
        uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2
        with:
          deno-version: v2.9.x

      - name: Cache Deno modules
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.cache/deno
          key: deno-${{ runner.os }}-${{ hashFiles('deno.lock') }}
          restore-keys: deno-${{ runner.os }}-

      - name: Sync deno.lock
        run: deno install --frozen=false

      - name: Deno unit suite (self-contained)
        run: node scripts/deno-test-suite.mjs --mode unit --verbose

      - name: Deno live suite (secrets-dependent, nunca bloqueia por credencial)
        run: node scripts/deno-test-suite.mjs --mode live --verbose

  # Executor das suites SQL (supabase/tests/): o que dá para checar sem banco
  # roda em todo PR (higiene de migrations + matriz de cobertura public);
  # a execução real contra o banco fica atrás do secret SUPABASE_DB_URL —
  # ausente, documenta o comando e não reprova.
  sql-tests:
    name: SQL Suites (static + remote)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: detect-changes
    if: needs.detect-changes.outputs.has-code == 'true'
    env:
      HUSKY: 0
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '22'

      - name: Install psql (para o tier remoto, quando SUPABASE_DB_URL existir)
        run: sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends postgresql-client

      - name: SQL suites — static + remote
        run: scripts/run-sql-tests.sh all

      - name: Upload coverage matrix
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: sql-coverage-matrix
          path: sql-coverage-matrix.md
          if-no-files-found: ignore
          retention-days: 30

  # Smoke de carga real com k6 (scripts/load/k6-smoke.js) — substitui a fachada
  # anterior, que media OPTIONS num projeto Supabase antigo e engolia falhas.
  # Não roda carga contra produção em todo PR: exige a var K6_TARGET_BASE_URL
  # (Repository Settings > Variables) ou workflow_dispatch; sem alvo, deixa o
  # comando documentado no summary e passa.
  k6-smoke:
    name: k6 Load Smoke
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: detect-changes
    if: needs.detect-changes.outputs.has-code == 'true' || github.event_name == 'workflow_dispatch'
    env:
      K6_VERSION: v1.8.1
      K6_BASE_URL: ${{ vars.K6_TARGET_BASE_URL }}
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install k6
        run: |
          curl -fsSL -o /tmp/k6.tar.gz "https://github.com/grafana/k6/releases/download/${K6_VERSION}/k6-${K6_VERSION}-linux-amd64.tar.gz"
          curl -fsSL -o /tmp/k6-checksums.txt "https://github.com/grafana/k6/releases/download/${K6_VERSION}/k6-${K6_VERSION}-checksums.txt"
          EXPECTED=$(awk "/k6-${K6_VERSION}-linux-amd64.tar.gz/ {print \$1}" /tmp/k6-checksums.txt)
          ACTUAL=$(sha256sum /tmp/k6.tar.gz | awk '{print $1}')
          if [ "$EXPECTED" != "$ACTUAL" ]; then
            echo "::error::checksum do k6 diverge ($EXPECTED != $ACTUAL)"
            exit 1
          fi
          tar -xzf /tmp/k6.tar.gz -C /tmp
          sudo cp "/tmp/k6-${K6_VERSION}-linux-amd64/k6" /usr/local/bin/k6
          k6 version

      - name: Run k6 smoke
        run: |
          if [ -z "$K6_BASE_URL" ]; then
            {
              echo "### k6 smoke — pulado (sem alvo)"
              echo ""
              echo "Defina a var \`K6_TARGET_BASE_URL\` (Settings > Variables) ou rode local:"
              echo ""
              echo '```'
              echo "K6_BASE_URL=https://usyxfpqlsspldubptrdl.supabase.co k6 run scripts/load/k6-smoke.js"
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            echo "::warning::K6_TARGET_BASE_URL não definido — smoke de carga documentado, não executado."
            exit 0
          fi
          k6 run scripts/load/k6-smoke.js

  e2e:
    name: E2E Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: lint-and-typecheck
    # Só em PRs internas humanas (job pesado). A execução exige configuração
    # completa: URL, publishable key e conta E2E. Configuração parcial falha
    # imediatamente para não produzir timeouts ou falso sinal de cobertura.
    # Sem nenhum segredo, a suíte é marcada explicitamente como skipped.
    # environment: pr-preview — secrets ficam restritos a este job; fork PRs
    # não acessam o ambiente (GitHub bloqueia deployments de fork por padrão).
    if: (github.event_name == 'pull_request' && github.actor != 'dependabot[bot]' && github.event.pull_request.head.repo.full_name == github.repository) || github.event_name == 'workflow_dispatch'
    environment: pr-preview
    env:
      HUSKY: 0

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Validar configuração E2E
        id: skip
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
          E2E_TEST_EMAIL: ${{ secrets.E2E_TEST_EMAIL }}
          E2E_TEST_PASSWORD: ${{ secrets.E2E_TEST_PASSWORD }}
        run: |
          REQUIRED=(VITE_SUPABASE_URL VITE_SUPABASE_PUBLISHABLE_KEY E2E_TEST_EMAIL E2E_TEST_PASSWORD)
          MISSING=()
          PRESENT=0
          for NAME in "${REQUIRED[@]}"; do
            if [ -z "${!NAME}" ]; then
              MISSING+=("$NAME")
            else
              PRESENT=$((PRESENT + 1))
            fi
          done

          if [ "$PRESENT" -eq 0 ]; then
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "::warning::E2E SKIPPED: nenhum segredo de integração está configurado"
          elif [ "${#MISSING[@]}" -gt 0 ]; then
            echo "::error::Configuração E2E parcial. Secrets ausentes: ${MISSING[*]}"
            exit 1
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Verificar validade das credenciais Supabase
        id: precheck
        if: steps.skip.outputs.run == 'true'
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
          E2E_TEST_EMAIL: ${{ secrets.E2E_TEST_EMAIL }}
          E2E_TEST_PASSWORD: ${{ secrets.E2E_TEST_PASSWORD }}
        run: |
          set +e
          node scripts/e2e-precheck.mjs
          CODE=$?
          set -e
          if [ "$CODE" -eq 0 ]; then
            echo "valid=true" >> "$GITHUB_OUTPUT"
          elif [ "$CODE" -eq 3 ]; then
            echo "valid=skip" >> "$GITHUB_OUTPUT"
          else
            echo "::error::Credenciais E2E configuradas, mas inválidas. Corrija ou remova a configuração parcial; não é seguro aprovar o gate sem executar os cenários."
            exit 1
          fi

      - name: Install Playwright Browsers
        if: steps.skip.outputs.run == 'true' && steps.precheck.outputs.valid == 'true'
        run: npx playwright install --with-deps chromium webkit

      - name: Run E2E Tests
        if: steps.skip.outputs.run == 'true' && steps.precheck.outputs.valid == 'true'
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
          # Derivado da URL verificada pelo precheck (fallback: ref conhecido).
          VITE_SUPABASE_PROJECT_ID: ${{ steps.precheck.outputs.project_ref || 'usyxfpqlsspldubptrdl' }}
          E2E_TEST_EMAIL: ${{ secrets.E2E_TEST_EMAIL }}
          E2E_TEST_PASSWORD: ${{ secrets.E2E_TEST_PASSWORD }}
        run: npm run test:e2e

      - name: Upload Playwright Report
        if: always() && steps.skip.outputs.run == 'true' && steps.precheck.outputs.valid == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30

  build:
    name: Build Check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: lint-and-typecheck
    env:
      HUSKY: 0

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build project
        run: npm run build

      - name: Check build size
        run: |
          BUILD_SIZE=$(du -sh dist | cut -f1)
          echo "Build size: $BUILD_SIZE"

  lighthouse:
    name: Lighthouse Performance Audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: build
    if: github.event_name == 'pull_request' && github.actor != 'dependabot[bot]'
    env:
      HUSKY: 0

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build project
        # Placeholders: src/integrations/supabase/client.ts lança no boot sem
        # essas envs → tela branca → Lighthouse morria com NO_FCP em toda PR.
        # Valores falsos bastam para o shell pintar a tela de /auth.
        env:
          VITE_SUPABASE_URL: https://placeholder.supabase.co
          VITE_SUPABASE_PUBLISHABLE_KEY: placeholder-anon-key
        run: npm run build

      - name: Run Lighthouse CI
        uses: treosh/lighthouse-ci-action@3e7e23fb74242897f95c0ba9cabad3d0227b9b18 # v12
        with:
          uploadArtifacts: true
          configPath: .lighthouserc.json

  bundle-size:
    name: Bundle Size Check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: build
    if: github.event_name == 'pull_request'
    env:
      HUSKY: 0

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build project (with bundle analysis)
        run: ANALYZE_BUNDLE=1 npm run build

      # Antes, este job só imprimia o tamanho dos chunks sem falhar nada — o
      # guard real (scripts/check-bundle-budget.mjs, por chunk, com budgets
      # calibrados) só rodava localmente e no qa-exhaustive.yml semanal. Uma
      # regressão de peso podia viver em main até 7 dias. O guard roda em toda
      # PR e quebra o job se algum chunk estourar o teto.
      - name: Enforce per-chunk bundle budget
        run: node scripts/check-bundle-budget.mjs | tee -a "$GITHUB_STEP_SUMMARY"

  gen-types-drift:
    name: Supabase Types Drift
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: detect-changes
    # Not a required check — needs SUPABASE_ACCESS_TOKEN; skips gracefully without it.
    if: github.event_name == 'pull_request' && needs.detect-changes.outputs.has-code == 'true'
    env:
      HUSKY: 0
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@45a513f8c64c0bc8e0e3dfe572b5c95be85f6359 # v3
        with:
          version: latest

      - name: Check types drift
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "SUPABASE_ACCESS_TOKEN not set — skipping types drift check."
            exit 0
          fi
          supabase gen types typescript --project-id usyxfpqlsspldubptrdl > /tmp/generated_types.ts
          if ! diff -q src/integrations/supabase/types.ts /tmp/generated_types.ts > /dev/null 2>&1; then
            echo "::error::Types are out of sync. Run: supabase gen types typescript --project-id usyxfpqlsspldubptrdl > src/integrations/supabase/types.ts"
            diff src/integrations/supabase/types.ts /tmp/generated_types.ts | head -60
            exit 1
          fi
          echo "Types are in sync with the live schema."

  ci-gate:
    name: CI Gate
    runs-on: ubuntu-latest
    timeout-minutes: 2
    # Apenas os 3 jobs que eram required checks antes (security-audit e
    # edge-functions-lint são informativos — intencionalmente fora do gate).
    needs: [lint-and-typecheck, test, build]
    if: always()
    steps:
      - name: Check required jobs
        run: |
          RESULTS='${{ toJSON(needs) }}'
          FAILED=$(echo "$RESULTS" | grep -c '"result": "failure"' || true)
          if [ "$FAILED" -gt 0 ]; then
            echo "Um ou mais jobs obrigatórios falharam."
            exit 1
          fi
          echo "Todos os checks passaram (ou PR é doc-only e os jobs foram pulados)."

  notify-failure:
    name: Notify on failure
    runs-on: ubuntu-latest
    timeout-minutes: 3
    # lighthouse fica de fora — falha por ambiente, e alarme cronicamente falso
    # ensina a ignorar alarmes. e2e entra: credencial inválida agora falha de
    # verdade (antes virava skip verde), então precisa de notificação.
    needs:
      [lint-and-typecheck, security-audit, test, edge-functions-lint, deno-tests, sql-tests, e2e, build, bundle-size]
    if: failure()
    steps:
      # Sem o secret SLACK_CI_WEBHOOK_URL configurado, o step apenas loga —
      # a notificação nativa do GitHub (e-mail ao dono) continua valendo.
      - name: Slack notification (opcional)
        env:
          SLACK_CI_WEBHOOK_URL: ${{ secrets.SLACK_CI_WEBHOOK_URL }}
          GH_REPO: ${{ github.repository }}
          GH_WORKFLOW: ${{ github.workflow }}
          GH_EVENT: ${{ github.event_name }}
          GH_SERVER: ${{ github.server_url }}
          GH_RUN_ID: ${{ github.run_id }}
        run: |
          if [ -z "$SLACK_CI_WEBHOOK_URL" ]; then
            echo "SLACK_CI_WEBHOOK_URL não configurado — pulando notificação Slack."
            exit 0
          fi
          curl -sS -X POST -H 'Content-Type: application/json' \
            -d "{\"text\":\"🔴 CI falhou: $GH_REPO — $GH_WORKFLOW ($GH_EVENT) — $GH_SERVER/$GH_REPO/actions/runs/$GH_RUN_ID\"}" \
            "$SLACK_CI_WEBHOOK_URL"
