name: PR Checks

# Pipeline canônico de qualidade (consolidação de lint.yml + enterprise-quality.yml,
# que rodavam os mesmos gates em duplicidade no mesmo PR).
# - pull_request → gate completo (lint, types, secrets, tests+coverage, deno lint,
#   e2e, build, lighthouse, bundle)
# - push em main → gates essenciais (lint, types, tests, build), sem os jobs pesados
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Um run por ref: push novo na mesma PR cancela o run anterior (economia de
# minutos — repo privado consome quota de Actions).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-typecheck:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      HUSKY: 0

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      # Etapa 48 do plano de 50 etapas: o guard e o teto (126, calibrado em
      # 2026-09) já existiam, mas só rodavam no qa-exhaustive.yml semanal — a
      # baseline podia crescer por até 7 dias sem que nenhuma PR percebesse.
      # Roda por PR agora; o teto só desce (ajuste scripts/../--max-warnings
      # ao consertar violações, nunca ao adicionar novas).
      - name: Complexity & file-length ratchet
        run: npm run lint:complexity

      - name: Run TypeScript check
        run: npm run typecheck

      - name: Committed secrets scan
        run: npm run security:secrets

      - name: Graphify wrapper tests
        run: npm run graphify:test

  # Job próprio, FORA dos required checks do ruleset: npm audit consulta o
  # advisory DB em tempo de execução — um advisory novo ficaria vermelho e,
  # como required, bloquearia todo merge (inclusive a PR do próprio fix).
  security-audit:
    name: Security Audit (production deps)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      HUSKY: 0
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: npm audit
        run: npm audit --omit=dev --audit-level=high

  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: lint-and-typecheck
    env:
      HUSKY: 0

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run Unit Tests (with coverage gate)
        run: npm run test:coverage

      # Etapa 31/32 do plano de 50 etapas: o threshold do vitest.config.ts
      # media 16 arquivos escolhidos a dedo (99,9% de <1% do código) e
      # circulava como se fosse a cobertura do sistema. Agora o escopo é
      # src/** inteiro e este passo garante que o número real só sobe.
      - name: Coverage ratchet (nunca cai)
        run: npm run coverage:ratchet

  edge-functions-lint:
    name: Edge Functions Lint (deno)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      HUSKY: 0

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          # Pinado na minor: uma major/minor nova pode trazer regra de lint e
          # quebrar o gate sem mudança de código.
          deno-version: v2.2.x

      - name: Deno lint (supabase/functions)
        run: deno lint

  e2e:
    name: E2E Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: lint-and-typecheck
    # Só em PRs internas humanas (job pesado). A execução exige configuração
    # completa: URL, publishable key e conta E2E. Configuração parcial falha
    # imediatamente para não produzir timeouts ou falso sinal de cobertura.
    # Sem nenhum segredo, a suíte é marcada explicitamente como skipped.
    if: (github.event_name == 'pull_request' && github.actor != 'dependabot[bot]' && github.event.pull_request.head.repo.full_name == github.repository) || github.event_name == 'workflow_dispatch'
    env:
      HUSKY: 0

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Validar configuração E2E
        id: skip
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
          E2E_TEST_EMAIL: ${{ secrets.E2E_TEST_EMAIL }}
          E2E_TEST_PASSWORD: ${{ secrets.E2E_TEST_PASSWORD }}
        run: |
          REQUIRED=(VITE_SUPABASE_URL VITE_SUPABASE_PUBLISHABLE_KEY E2E_TEST_EMAIL E2E_TEST_PASSWORD)
          MISSING=()
          PRESENT=0
          for NAME in "${REQUIRED[@]}"; do
            if [ -z "${!NAME}" ]; then
              MISSING+=("$NAME")
            else
              PRESENT=$((PRESENT + 1))
            fi
          done

          if [ "$PRESENT" -eq 0 ]; then
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "::warning::E2E SKIPPED: nenhum segredo de integração está configurado"
          elif [ "${#MISSING[@]}" -gt 0 ]; then
            echo "::error::Configuração E2E parcial. Secrets ausentes: ${MISSING[*]}"
            exit 1
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Verificar validade das credenciais Supabase
        id: precheck
        if: steps.skip.outputs.run == 'true'
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
          E2E_TEST_EMAIL: ${{ secrets.E2E_TEST_EMAIL }}
          E2E_TEST_PASSWORD: ${{ secrets.E2E_TEST_PASSWORD }}
        run: |
          if node scripts/e2e-precheck.mjs; then
            echo "valid=true" >> "$GITHUB_OUTPUT"
          else
            echo "valid=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Install Playwright Browsers
        if: steps.skip.outputs.run == 'true' && steps.precheck.outputs.valid == 'true'
        run: npx playwright install --with-deps chromium webkit

      - name: Run E2E Tests
        if: steps.skip.outputs.run == 'true' && steps.precheck.outputs.valid == 'true'
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
          VITE_SUPABASE_PROJECT_ID: usyxfpqlsspldubptrdl
          E2E_TEST_EMAIL: ${{ secrets.E2E_TEST_EMAIL }}
          E2E_TEST_PASSWORD: ${{ secrets.E2E_TEST_PASSWORD }}
        run: npm run test:e2e

      - name: Upload Playwright Report
        if: always() && steps.skip.outputs.run == 'true' && steps.precheck.outputs.valid == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30

  build:
    name: Build Check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: lint-and-typecheck
    env:
      HUSKY: 0

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build project
        run: npm run build

      - name: Check build size
        run: |
          BUILD_SIZE=$(du -sh dist | cut -f1)
          echo "Build size: $BUILD_SIZE"

  lighthouse:
    name: Lighthouse Performance Audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: build
    if: github.event_name == 'pull_request' && github.actor != 'dependabot[bot]'
    env:
      HUSKY: 0

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build project
        # Placeholders: src/integrations/supabase/client.ts lança no boot sem
        # essas envs → tela branca → Lighthouse morria com NO_FCP em toda PR.
        # Valores falsos bastam para o shell pintar a tela de /auth.
        env:
          VITE_SUPABASE_URL: https://placeholder.supabase.co
          VITE_SUPABASE_PUBLISHABLE_KEY: placeholder-anon-key
        run: npm run build

      - name: Run Lighthouse CI
        uses: treosh/lighthouse-ci-action@v12
        with:
          uploadArtifacts: true
          configPath: .lighthouserc.json

  bundle-size:
    name: Bundle Size Check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: build
    if: github.event_name == 'pull_request'
    env:
      HUSKY: 0

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build project (with bundle analysis)
        run: ANALYZE_BUNDLE=1 npm run build

      # Etapa 42 do plano de 50 etapas: antes, este job só imprimia o tamanho
      # dos chunks (`Report bundle sizes`) sem falhar nada — o único guard real
      # (scripts/check-bundle-budget.mjs, por chunk, com budgets calibrados)
      # só rodava em `npm run ci` local e no qa-exhaustive.yml semanal. Uma
      # regressão de peso podia viver em main até 7 dias. Agora o mesmo guard
      # roda em toda PR e quebra o job se algum chunk estourar o teto.
      - name: Enforce per-chunk bundle budget
        run: node scripts/check-bundle-budget.mjs | tee -a "$GITHUB_STEP_SUMMARY"

  gen-types-drift:
    name: Supabase Types Drift
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # Not a required check — needs SUPABASE_ACCESS_TOKEN; skips gracefully without it.
    if: github.event_name == 'pull_request'
    env:
      HUSKY: 0
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v3
        with:
          version: latest

      - name: Check types drift
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "SUPABASE_ACCESS_TOKEN not set — skipping types drift check."
            exit 0
          fi
          supabase gen types typescript --project-id usyxfpqlsspldubptrdl > /tmp/generated_types.ts
          if ! diff -q src/integrations/supabase/types.ts /tmp/generated_types.ts > /dev/null 2>&1; then
            echo "::error::Types are out of sync. Run: supabase gen types typescript --project-id usyxfpqlsspldubptrdl > src/integrations/supabase/types.ts"
            diff src/integrations/supabase/types.ts /tmp/generated_types.ts | head -60
            exit 1
          fi
          echo "Types are in sync with the live schema."

  notify-failure:
    name: Notify on failure
    runs-on: ubuntu-latest
    timeout-minutes: 3
    # e2e e lighthouse ficam de fora até os secrets de E2E existirem — hoje
    # falham/estouram timeout por ambiente, e alarme cronicamente falso ensina
    # a ignorar alarmes.
    needs: [lint-and-typecheck, security-audit, test, edge-functions-lint, build, bundle-size]
    if: failure()
    steps:
      # Sem o secret SLACK_CI_WEBHOOK_URL configurado, o step apenas loga —
      # a notificação nativa do GitHub (e-mail ao dono) continua valendo.
      - name: Slack notification (opcional)
        env:
          SLACK_CI_WEBHOOK_URL: ${{ secrets.SLACK_CI_WEBHOOK_URL }}
        run: |
          if [ -z "$SLACK_CI_WEBHOOK_URL" ]; then
            echo "SLACK_CI_WEBHOOK_URL não configurado — pulando notificação Slack."
            exit 0
          fi
          curl -sS -X POST -H 'Content-Type: application/json' \
            -d "{\"text\":\"🔴 CI falhou: ${{ github.repository }} — ${{ github.workflow }} (${{ github.event_name }}) — ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}\"}" \
            "$SLACK_CI_WEBHOOK_URL"
