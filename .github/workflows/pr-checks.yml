name: PR Checks

# Pipeline canônico de qualidade (consolidação de lint.yml + enterprise-quality.yml,
# que rodavam os mesmos gates em duplicidade no mesmo PR).
# - pull_request → gate completo (lint, types, secrets, tests+coverage, deno lint,
#   e2e, build, lighthouse, bundle)
# - push em main → gates essenciais (lint, types, tests, build), sem os jobs pesados
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Um run por ref: push novo na mesma PR cancela o run anterior (economia de
# minutos — repo privado consome quota de Actions).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-typecheck:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      HUSKY: 0

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: Run TypeScript check
        run: npm run typecheck

      - name: Committed secrets scan
        run: npm run security:secrets

  # Job próprio, FORA dos required checks do ruleset: npm audit consulta o
  # advisory DB em tempo de execução — um advisory novo ficaria vermelho e,
  # como required, bloquearia todo merge (inclusive a PR do próprio fix).
  security-audit:
    name: Security Audit (production deps)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      HUSKY: 0
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: npm audit
        run: npm audit --omit=dev --audit-level=high

  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: lint-and-typecheck
    env:
      HUSKY: 0

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run Unit Tests (with coverage gate)
        run: npm run test:coverage

  edge-functions-lint:
    name: Edge Functions Lint (deno)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      HUSKY: 0

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          # Pinado na minor: uma major/minor nova pode trazer regra de lint e
          # quebrar o gate sem mudança de código.
          deno-version: v2.2.x

      - name: Deno lint (supabase/functions)
        run: deno lint

  e2e:
    name: E2E Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: lint-and-typecheck
    # Só em PRs internas humanas (job pesado). NOTA: o job hoje roda SEM os
    # secrets de E2E (o repo ainda não os tem) — os specs autenticados skipam e
    # o restante pode estourar o timeout; por isso ele NÃO é required check nem
    # alimenta o notify-failure. Ao criar os secrets, plugá-los aqui via env.
    if: github.event_name == 'pull_request' && github.actor != 'dependabot[bot]' && github.event.pull_request.head.repo.full_name == github.repository
    env:
      HUSKY: 0

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps chromium webkit

      - name: Run E2E Tests
        run: npm run test:e2e

      - name: Upload Playwright Report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30

  build:
    name: Build Check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: lint-and-typecheck
    env:
      HUSKY: 0

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build project
        run: npm run build

      - name: Check build size
        run: |
          BUILD_SIZE=$(du -sh dist | cut -f1)
          echo "Build size: $BUILD_SIZE"

  lighthouse:
    name: Lighthouse Performance Audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: build
    if: github.event_name == 'pull_request' && github.actor != 'dependabot[bot]'
    env:
      HUSKY: 0

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build project
        # Placeholders: src/integrations/supabase/client.ts lança no boot sem
        # essas envs → tela branca → Lighthouse morria com NO_FCP em toda PR.
        # Valores falsos bastam para o shell pintar a tela de /auth.
        env:
          VITE_SUPABASE_URL: https://placeholder.supabase.co
          VITE_SUPABASE_PUBLISHABLE_KEY: placeholder-anon-key
        run: npm run build

      - name: Run Lighthouse CI
        uses: treosh/lighthouse-ci-action@v12
        with:
          uploadArtifacts: true
          configPath: .lighthouserc.json

  bundle-size:
    name: Bundle Size Check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: build
    if: github.event_name == 'pull_request'
    env:
      HUSKY: 0

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build project
        run: npm run build

      - name: Report bundle sizes
        run: |
          echo "## 📦 Bundle Size Report" >> $GITHUB_STEP_SUMMARY
          echo "| File | Size |" >> $GITHUB_STEP_SUMMARY
          echo "|------|------|" >> $GITHUB_STEP_SUMMARY
          for f in dist/assets/*.js; do
            SIZE=$(wc -c < "$f" | awk '{printf "%.1f KB", $1/1024}')
            NAME=$(basename "$f")
            echo "| \`$NAME\` | $SIZE |" >> $GITHUB_STEP_SUMMARY
          done
          TOTAL=$(du -sh dist | cut -f1)
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Total build size:** $TOTAL" >> $GITHUB_STEP_SUMMARY

  notify-failure:
    name: Notify on failure
    runs-on: ubuntu-latest
    timeout-minutes: 3
    # e2e e lighthouse ficam de fora até os secrets de E2E existirem — hoje
    # falham/estouram timeout por ambiente, e alarme cronicamente falso ensina
    # a ignorar alarmes.
    needs: [lint-and-typecheck, security-audit, test, edge-functions-lint, build, bundle-size]
    if: failure()
    steps:
      # Sem o secret SLACK_CI_WEBHOOK_URL configurado, o step apenas loga —
      # a notificação nativa do GitHub (e-mail ao dono) continua valendo.
      - name: Slack notification (opcional)
        env:
          SLACK_CI_WEBHOOK_URL: ${{ secrets.SLACK_CI_WEBHOOK_URL }}
        run: |
          if [ -z "$SLACK_CI_WEBHOOK_URL" ]; then
            echo "SLACK_CI_WEBHOOK_URL não configurado — pulando notificação Slack."
            exit 0
          fi
          curl -sS -X POST -H 'Content-Type: application/json' \
            -d "{\"text\":\"🔴 CI falhou: ${{ github.repository }} — ${{ github.workflow }} (${{ github.event_name }}) — ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}\"}" \
            "$SLACK_CI_WEBHOOK_URL"
