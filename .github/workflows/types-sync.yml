# docs:
#   gatilho: push na main que toque supabase/migrations ou o próprio sync, agendado (seg 05:49 UTC) e dispatch
#   prova: src/integrations/supabase/types.ts igual ao banco oficial (supabase gen types --project-id usyxfpqlsspldubptrdl)
#   falha: drift que quebra o typecheck vira issue [types-sync] (nada é aplicado); drift válido vira PR automation/types-sync com auto-merge
#   avisa: PR de types e issue [types-sync]
# nao-e-bug:
#   - sem-pr: "sem drift" significa que o types.ts commitado já bate com o banco
#   - pr-nao-abre: exige Settings → Actions → General → "Allow GitHub Actions to create and approve pull requests" ligado
name: types-sync

# Auto-correção do types.ts: hoje o drift banco × types.ts é corrigido à mão (ex.: commits 1d2ddef e
# 1bad373, "corrige drift do schema Supabase"). Este workflow regenera o arquivo do banco oficial,
# confere que é do projeto certo (scripts/types-sync/validar.mjs), prova que o código ainda compila
# e entrega por PR com auto-merge — nunca push direto em main.
#
# Dois jobs, de propósito: `ler-banco` tem o SUPABASE_ACCESS_TOKEN e não instala dependência
# nenhuma; `gates-e-pr` roda npm ci e abre o PR, mas nunca vê o token do banco.
# Mesmo padrão do types-sync.yml do Zapp_Web_V2 (lá também atualiza catálogo/manifesto; aqui só types.ts).

on:
  push:
    branches: [main]
    paths:
      - 'supabase/migrations/**'
      - 'scripts/types-sync/**'
      - '.github/workflows/types-sync.yml'
  schedule:
    - cron: '49 5 * * 1' # segunda 05:49 UTC, antes do inventário semanal (10:23), que confere a origem pelo types.ts
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: types-sync
  cancel-in-progress: false

defaults:
  run:
    shell: bash --noprofile --norc -euo pipefail {0}

env:
  SUPABASE_CLI_VERSION: '2.116.0'
  PROJECT_REF: usyxfpqlsspldubptrdl
  TYPES_PATH: src/integrations/supabase/types.ts
  SYNC_BRANCH: automation/types-sync

jobs:
  ler-banco:
    name: Ler banco oficial e gerar candidato
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      mudou: ${{ steps.validar.outputs.mudou }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: '.nvmrc'

      - name: Setup Supabase CLI ${{ env.SUPABASE_CLI_VERSION }}
        uses: supabase/setup-cli@d239d1052f6f024a8d746d7e5aeddead63b9cb53 # v3.1.0
        with:
          version: ${{ env.SUPABASE_CLI_VERSION }}

      - name: Gerar types.ts do banco oficial (Management API, só leitura)
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          if [ -z "${SUPABASE_ACCESS_TOKEN:-}" ]; then
            echo "::error::SUPABASE_ACCESS_TOKEN ausente — sem ele não há como ler o schema do banco oficial."
            exit 1
          fi
          umask 077
          supabase gen types typescript --project-id "$PROJECT_REF" > "$RUNNER_TEMP/types.new.ts"
          echo "types.ts gerado: $(wc -c < "$RUNNER_TEMP/types.new.ts") bytes"

      - name: Validar origem e classificar drift
        id: validar
        run: |
          node scripts/types-sync/validar.mjs "$RUNNER_TEMP/types.new.ts" --atual "$TYPES_PATH" \
            --resumo "$RUNNER_TEMP/resumo.md" > "$RUNNER_TEMP/resultado.json"
          mudou="$(node -e 'console.log(JSON.parse(require("fs").readFileSync(process.argv[1], "utf8")).mudou)' "$RUNNER_TEMP/resultado.json")"
          echo "mudou=$mudou" >> "$GITHUB_OUTPUT"
          {
            echo "### types-sync — drift: $mudou"
            cat "$RUNNER_TEMP/resumo.md"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Publicar candidato para o job do PR
        if: steps.validar.outputs.mudou == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: types-sync-candidato-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/types.new.ts
            ${{ runner.temp }}/resumo.md
          if-no-files-found: error
          retention-days: 1


  notifica-falha-geracao:
    name: Notificar falha na geração do schema
    needs: ler-banco
    if: failure() && needs.ler-banco.result == 'failure'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      issues: write
    steps:
      - name: Registrar falha em issue
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const { owner, repo } = context.repo;
            const titulo = '[types-sync] falha na geração do schema';
            const run = `${context.serverUrl}/${owner}/${repo}/actions/runs/${context.runId}`;
            const corpo = [
              'O job `ler-banco` falhou antes de gerar o candidato de `types.ts`.',
              'Causas prováveis: `SUPABASE_ACCESS_TOKEN` ausente, `supabase gen types` falhou, ou candidato rejeitado pelo validador.',
              'Nada foi aplicado ao banco ou ao código.',
              '', `Run: ${run}`,
            ].join('\n');
            try { await github.rest.issues.createLabel({ owner, repo, name: 'types-sync', color: 'e11d48', description: 'Alerta do types-sync' }); } catch {}
            const { data: abertas } = await github.rest.issues.listForRepo({ owner, repo, state: 'open', labels: 'types-sync', per_page: 20 });
            const existente = abertas.find((i) => !i.pull_request && i.title === titulo);
            if (existente) await github.rest.issues.createComment({ owner, repo, issue_number: existente.number, body: corpo });
            else await github.rest.issues.create({ owner, repo, title: titulo, body: corpo, labels: ['types-sync'] });

  gates-e-pr:
    name: Gates e PR de sincronização (sem credencial do banco)
    needs: ler-banco
    if: needs.ler-banco.outputs.mudou == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:  # zizmor: ignore[excessive-permissions]
      contents: write       # branch do PR
      pull-requests: write  # abrir/atualizar o PR
      actions: write        # liberar os checks do PR aberto com GITHUB_TOKEN
      issues: write         # issue [types-sync] quando o gate recusa
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Baixar candidato
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: types-sync-candidato-${{ github.run_id }}
          path: ${{ runner.temp }}/candidato

      - name: Aplicar candidato no worktree
        run: |
          cp "$RUNNER_TEMP/candidato/types.new.ts" "$TYPES_PATH"
          git diff --stat -- "$TYPES_PATH"

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: '.nvmrc'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Instalar dependências
        env:
          HUSKY: '0'
        run: npm ci --no-audit --no-fund

      # Mesmos dois checks de tipo do PR Checks: se o banco mudou de um jeito que o código não
      # acompanha, o PR não é aberto — vira issue para alguém ajustar o código junto.
      - name: Gate — typecheck e ratchet estrito
        id: gate
        run: |
          npm run typecheck
          npm run typecheck:baseline

      - name: Registrar recusa do gate em issue
        if: failure() && steps.gate.outcome == 'failure'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          RESUMO_PATH: ${{ runner.temp }}/candidato/resumo.md
        with:
          script: |
            const fs = require('fs');
            const { owner, repo } = context.repo;
            const titulo = '[types-sync] drift do banco quebra o typecheck';
            const run = `${context.serverUrl}/${owner}/${repo}/actions/runs/${context.runId}`;
            const resumo = fs.existsSync(process.env.RESUMO_PATH) ? fs.readFileSync(process.env.RESUMO_PATH, 'utf8') : '';
            const corpo = [
              'O banco oficial mudou e o `types.ts` regenerado não compila com o código atual (ou piora o ratchet estrito).',
              'Nada foi aplicado. Ajuste o código ao schema novo e rode o types-sync de novo (dispatch).',
              '', `Run: ${run}`, '', resumo,
            ].join('\n');
            try { await github.rest.issues.createLabel({ owner, repo, name: 'types-sync', color: 'e11d48', description: 'Alerta do types-sync' }); } catch {}
            const { data: abertas } = await github.rest.issues.listForRepo({ owner, repo, state: 'open', labels: 'types-sync', per_page: 20 });
            const existente = abertas.find((i) => !i.pull_request && i.title === titulo);
            if (existente) await github.rest.issues.createComment({ owner, repo, issue_number: existente.number, body: corpo });
            else await github.rest.issues.create({ owner, repo, title: titulo, body: corpo, labels: ['types-sync'] });

      - name: Montar corpo do PR
        run: |
          {
            echo 'Sincronização automática de `src/integrations/supabase/types.ts` com o banco oficial'
            echo '(`usyxfpqlsspldubptrdl`, `supabase gen types typescript --project-id`), feita por `.github/workflows/types-sync.yml`.'
            echo
            echo '- gate: `npm run typecheck` e `npm run typecheck:baseline` passaram com o arquivo novo'
            echo "- main de origem: \`$GITHUB_SHA\`"
            echo "- run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
            echo
            cat "$RUNNER_TEMP/candidato/resumo.md"
          } > "$RUNNER_TEMP/corpo.md"

      - name: Abrir ou atualizar PR de sincronização
        id: pull-request
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        env:
          HUSKY: '0'
        with:
          token: ${{ github.token }}
          base: main
          branch: ${{ env.SYNC_BRANCH }}
          delete-branch: true
          commit-message: 'chore(types): sincroniza types.ts com o banco oficial [auto]'
          title: 'chore(types): sincroniza types.ts com o banco oficial'
          body-path: ${{ runner.temp }}/corpo.md
          labels: types-sync
          add-paths: |
            src/integrations/supabase/types.ts

      # PR aberto com GITHUB_TOKEN não dispara workflows: os checks nascem em action_required.
      # Mesmo destravamento do inventario-estado-semanal.yml, restrito à branch deste PR.
      - name: Destravar os checks do PR de sincronização
        if: steps.pull-request.outputs.pull-request-number != ''
        continue-on-error: true
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          PR_HEAD_SHA: ${{ steps.pull-request.outputs.pull-request-head-sha }}
        with:
          script: |
            const headSha = process.env.PR_HEAD_SHA;
            if (!headSha) {
              core.warning('create-pull-request nao devolveu o head sha; nada a destravar.');
              return;
            }
            const { owner, repo } = context.repo;
            let pendentes = [];
            for (let tentativa = 1; tentativa <= 6; tentativa += 1) {
              const { data } = await github.rest.actions.listWorkflowRunsForRepo({
                owner, repo, head_sha: headSha, head_branch: process.env.SYNC_BRANCH, status: 'action_required', per_page: 20,
              });
              pendentes = data.workflow_runs || [];
              if (pendentes.length > 0) break;
              await new Promise((resolve) => setTimeout(resolve, 10000));
            }
            const liberados = [];
            const recusados = [];
            for (const run of pendentes) {
              try {
                await github.rest.actions.approveWorkflowRun({ owner, repo, run_id: run.id });
                liberados.push(run.name);
              } catch (error) {
                recusados.push(`${run.name} (${error.status})`);
              }
            }
            await core.summary.addRaw([
              '### Checks do PR do types-sync',
              `- head sha: \`${headSha}\``,
              `- liberados: ${liberados.length > 0 ? liberados.join(', ') : 'nenhum'}`,
              ...(recusados.length > 0 ? [`- recusados: ${recusados.join(', ')} — aprovar na aba Actions`] : []),
            ].join('\n')).write();

      - name: Habilitar auto-merge no PR de sincronização
        if: steps.pull-request.outputs.pull-request-number != ''
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ steps.pull-request.outputs.pull-request-number }}
        run: gh pr merge --auto --squash "$PR_NUMBER" --repo "$GITHUB_REPOSITORY"
