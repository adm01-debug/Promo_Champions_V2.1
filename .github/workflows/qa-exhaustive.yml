name: QA Exhaustive (Weekly)

# Onda M — guard-rail semanal de excelência 10/10.
# Roda toda suíte estática (Vitest + Deno) mais os lints/guards de arquitetura
# (chunkedIn, notification-inserters, request-id fuzz) para detectar regressão
# de padrões que foram consolidados nas ondas I/J/K/L.

on:
  schedule:
    # Toda segunda-feira 03:00 UTC (00:00 BRT)
    - cron: "0 3 * * 1"
  workflow_dispatch: {}

concurrency:
  group: qa-exhaustive
  cancel-in-progress: true

jobs:
  qa-exhaustive:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Install deps
        run: npm ci

      - name: TypeScript strict check
        run: npx tsgo --noEmit

      - name: ESLint
        run: npm run lint

      - name: Dependency Cruiser — ciclos, layer boundaries e imports test→prod
        run: npm run deps:check

      - name: Dependency graph (SVG artifact)
        run: |
          sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends graphviz
          npm run deps:graph || echo "::warning::Falha ao gerar SVG (não bloqueia)"
        continue-on-error: true

      - name: Upload dependency graph
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dependency-graph
          path: dependency-graph.svg
          if-no-files-found: ignore
          retention-days: 30

      - name: Vitest — full suite (293+ cenários)
        run: npx vitest run --reporter=dot

      - name: Deno — shared guards (retry, cors, fuzz, chunked-in, notification-categories)
        run: |
          deno test --allow-read --allow-env --allow-net --no-check \
            --node-modules-dir=auto supabase/functions/_shared/

      - name: Deno — dispatcher & edge contract tests
        run: |
          deno test --allow-read --allow-env --no-check --node-modules-dir=auto \
            supabase/functions/lead-scoring/lead-scoring_test.ts \
            supabase/functions/execute-workflow/contracts_test.ts

      - name: Static guard — chunkedInClient enforcement
        run: npx vitest run src/lib/supabase/all-in-calls.test.ts --reporter=verbose

      - name: Build (para Lighthouse CI + bundle budget)
        run: ANALYZE_BUNDLE=1 npm run build

      - name: Bundle-size budget (Onda O)
        run: node scripts/check-bundle-budget.mjs

      - name: Upload bundle stats
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bundle-stats
          path: bundle-stats/
          retention-days: 30

      - name: Lighthouse CI — Web Vitals & a11y/SEO
        run: |
          npm install -g @lhci/cli@0.14.x
          npx vite preview --port 5173 --strictPort &
          PREVIEW_PID=$!
          # Poll até o preview responder (máx 30s)
          for i in $(seq 1 30); do
            if curl -sf http://localhost:5173 > /dev/null; then break; fi
            sleep 1
          done
          lhci autorun --config=.lighthouserc.json || echo "::warning::Lighthouse CI reportou regressões"
          kill $PREVIEW_PID || true
        continue-on-error: true

      - name: A11y sweep — Playwright + axe-core (Onda Q)
        run: |
          npx playwright install --with-deps chromium
          npx vite preview --port 5173 --strictPort &
          PREVIEW_PID=$!
          for i in $(seq 1 60); do
            if curl -sf http://localhost:5173 > /dev/null; then break; fi
            sleep 1
          done
          npx playwright test -c playwright.a11y.config.ts
          A11Y_EXIT=$?
          kill $PREVIEW_PID || true
          exit $A11Y_EXIT

      - name: Upload a11y report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: a11y-report
          path: |
            a11y-report.json
            a11y-report-html/
          if-no-files-found: ignore
          retention-days: 30

      - name: Summary
        if: always()
        run: |
          echo "### QA Exhaustive — $(date -u +%Y-%m-%d)" >> $GITHUB_STEP_SUMMARY
          echo "- Vitest: 293+ cenários" >> $GITHUB_STEP_SUMMARY
          echo "- Deno: 37+ cenários (inclui 917 request-id fuzz)" >> $GITHUB_STEP_SUMMARY
          echo "- Guards: chunkedIn, notification-inserters, request-id" >> $GITHUB_STEP_SUMMARY
          echo "- Bundle budget: scripts/check-bundle-budget.mjs (gzip por chunk)" >> $GITHUB_STEP_SUMMARY
          echo "- Lighthouse CI: perf/a11y/best-practices/SEO + Web Vitals" >> $GITHUB_STEP_SUMMARY
