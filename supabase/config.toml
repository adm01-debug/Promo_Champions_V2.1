[functions.campaign-health-alert]
verify_jwt = false

[functions.detect-client-churn-alerts]
verify_jwt = false

[functions.generate-coaching-actions]
# Chamado pelo trigger de call_recording via net.http_post sem header Authorization
# (20261117070000_reconcilia_objetos_orfaos_producao.sql:195-204). Com o default
# verify_jwt = true o gateway rejeita a chamada antes do codigo. A funcao valida
# X-Cron-Secret contra public._internal_secrets antes de qualquer trabalho.
verify_jwt = false

[functions.generate-urgent-client-tasks]
verify_jwt = false

[functions.notify-v4-quote-status]
verify_jwt = false

[functions.check-v4-callback-alerts]
verify_jwt = false

[functions.cron-failure-alerter]
verify_jwt = false

[functions.process-call-recording-ingest]
verify_jwt = false

[functions.edge-retry-threshold-alert]
verify_jwt = false

[functions.deal-risk-digest]
verify_jwt = false

[functions.email-bulk-retry]
verify_jwt = false

# Job interno do cron `supply-dispatch-1min`: entrega a fila supply_outbox ao
# Promo Supply. Sem JWT; autenticação por X-Cron-Secret + assinatura HMAC
# (PROMO_SUPPLY_WEBHOOK_SECRET) verificadas no handler.
[functions.supply-dispatch]
verify_jwt = false

# Job interno do cron `credit-dispatch-1min`: entrega a fila credit_outbox
# (análise de crédito da 1ª venda) ao Promo Finance. Sem JWT; autenticação por
# X-Cron-Secret + assinatura HMAC (PROMO_FINANCE_CREDITO_WEBHOOK_SECRET).
[functions.credit-dispatch]
verify_jwt = false

# Webhook do Promo Finance (credito.decidido): sem JWT; assinatura HMAC dedicada
# verificada no handler (FINANCE_CREDITO_WEBHOOK_SECRET).
[functions.receive-credit-decision]
verify_jwt = false

# Telemetria pública: sem JWT; proteção por rate-limit + validação estrita
# de payload no handler (amostras anônimas de Web Vitals).
[functions.log-web-vitals]
verify_jwt = false

# Webhooks externos de cotação (V4 legado e PromoGifts): sem JWT; assinatura
# HMAC dedicada verificada no handler (QUOTE_SYNC_WEBHOOK_SECRET /
# PROMOGIFTS_WEBHOOK_SECRET).
[functions.receive-quote-sync]
verify_jwt = false

# Webhook do Promo Design (design.created / design.updated): sem JWT; assinatura
# HMAC dedicada verificada no handler (DESIGN_SYNC_WEBHOOK_SECRET). Sem esta
# entrada o gateway responde 401 antes do handler rodar e nenhum design entra.
[functions.receive-design-sync]
verify_jwt = false

# Webhook do gift_store: sem JWT; chave dedicada x-api-key
# (QUOTE_SYNC_API_KEY) validada no handler.
[functions.receive-quote-webhook]
verify_jwt = false

# Embed público de relatórios: sem JWT; token opaco por embed (x-embed-token)
# validado no handler com rate-limit e allowlist de entidades/colunas.
[functions.report-embed-public]
verify_jwt = false

# Descadastro público (RFC 8058 / List-Unsubscribe): sem JWT; token HMAC por
# destinatário + rate-limit no handler.
[functions.email-unsubscribe]
verify_jwt = false

# Webhooks de provedores externos: a autenticação criptográfica ocorre no handler.
[functions.inbound-email-webhook]
verify_jwt = false

# Callback OAuth do Bitrix24: chega como redirect do browser sem JWT; o handler
# valida o state assinado (HMAC com TTL curto) e revalida o papel admin/manager
# do autorizador antes de gravar tokens.
[functions.bitrix24-oauth]
verify_jwt = false

# Respostas inbound do WhatsApp (Evolution): sem JWT; segredo/assinatura HMAC
# verificado no handler (WHATSAPP_INBOUND_WEBHOOK_SECRET).
[functions.whatsapp-inbound-webhook]
verify_jwt = false

[functions.multichannel-status-webhook]
verify_jwt = false

# Callbacks de voz da Twilio (sem JWT) — assinatura X-Twilio-Signature
# verificada no handler contra o token do tenant e/ou TWILIO_AUTH_TOKEN.
[functions.twilio-call-status]
verify_jwt = false

[functions.twilio-call-twiml]
verify_jwt = false

# migrate-helper removido: edge function aposentada no V2 (não deployada no destino; verify_jwt=false é risco de segurança)
# Health check público para monitor externo de uptime (docs/RUNBOOK.md §4).
# Não lê banco nem dados do usuário — resposta é apenas {status, version, timestamp}.
[functions.health]
verify_jwt = false
