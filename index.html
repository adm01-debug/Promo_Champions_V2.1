    <!-- Register Service Worker (production only — a SW in dev caches stale
         Vite chunks and survives normal hard-refreshes, masking real fixes) -->
    <script>
      var isLocalDev = ['localhost', '127.0.0.1'].indexOf(location.hostname) !== -1;
      if ('serviceWorker' in navigator) {
        if (isLocalDev) {
          // Clean up any SW previously registered while this guard didn't exist yet.
          navigator.serviceWorker.getRegistrations().then(function (regs) {
            regs.forEach(function (r) { r.unregister(); });
          }).catch(function () {});
        } else {
          window.addEventListener('load', function() {
            navigator.serviceWorker.register('/pwa-sw.js').catch(function() {});
          });
        }
      }
